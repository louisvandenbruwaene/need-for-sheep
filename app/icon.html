<!doctype html>
<html><head><meta charset="utf-8"><title>Need for Sheep icon</title>
<style>html,body{margin:0;background:transparent}svg{display:block;width:1024px;height:1024px}</style></head>
<body><div id="out"></div>
<script>
/* The Need for Sheep app icon: a macOS-style rounded square (824px tile, 100px margin) drawn as SVG. */
const tile=(bg,inner)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#c)">${bg}${inner}<rect x="100" y="100" width="824" height="824" fill="url(#sh)"/></g></svg>`;
const fill=(c1,c2)=>`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>`;
/* PixelLab mascot (mascot.png, 128px): a grinning collie with an unimpressed sheep on its head, scaled 6x
   with crisp pixels, its chest running off the bottom of the tile, over a sunburst on the field. */
const rays=[...Array(16)].map((_,i)=>{const a=i*Math.PI/8,b=a+Math.PI/16,R=900;
  return `<path d="M512 470 L${512+R*Math.cos(a)} ${470+R*Math.sin(a)} L${512+R*Math.cos(b)} ${470+R*Math.sin(b)}Z" fill="#fff" opacity=".09"/>`;}).join('');
const ICON=tile(fill('#a6d36f','#4f8a37'),`${rays}
    <ellipse cx="512" cy="470" rx="330" ry="330" fill="#fff6c8" opacity=".35"/>
    <ellipse cx="512" cy="960" rx="420" ry="90" fill="#2f5e22" opacity=".45"/>
    <image href="mascot.png" x="128" y="216" width="768" height="768" style="image-rendering:pixelated" preserveAspectRatio="none"/>`);
document.getElementById('out').innerHTML=ICON;
</script></body></html>
