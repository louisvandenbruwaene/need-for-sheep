// Pointer: the dog walks when you lead it closely and sprints when the pointer is far ahead.
// Keys: walk, Shift sprints. Only the selected dog takes these; the others stand still as blockers,
// unless the map sent one somewhere: it runs there on its own, until it arrives or you steer it.
function steerDogs(){
  if(pointerHeld&&pointerScreen)pointer=toField(pointerScreen); // the view moves under a still pointer
  world.dogs.forEach((dog,i)=>{
    dog.driving=false;
    if(mode!=='play')return;
    let x=0,y=0,flank=0;
    if(i===selected){
      for(const k of keys){if(MOVE_KEYS[k]){x+=MOVE_KEYS[k][0];y+=MOVE_KEYS[k][1];}if(WHISTLES[k])flank+=WHISTLES[k];}
      flank+=whistleHeld;
    }
    const steered=i===selected&&(pointerHeld&&pointer||x||y||flank);
    if(steered)dog.send=null;
    if(i===selected&&pointerHeld&&pointer){
      Object.assign(dog,{driving:true,targetX:pointer[0],targetY:pointer[1],maxSpeed:DOG_MAX,gain:2.6});
    }else if(flank&&!x&&!y){
      const to=flankTarget(dog,Math.sign(flank));
      if(to)Object.assign(dog,{driving:true,targetX:to[0],targetY:to[1],maxSpeed:DOG_MAX,gain:6});
    }else if(x||y){
      const len=Math.hypot(x,y);
      Object.assign(dog,{driving:true,targetX:dog.x+x/len*80,targetY:dog.y+y/len*80,maxSpeed:shift?DOG_MAX:DOG_WALK,gain:6});
    }else if(dog.send){
      if(Math.hypot(dog.send[0]-dog.x,dog.send[1]-dog.y)<12){dog.send=null;return;}
      const [tx,ty]=outrun(dog,dog.send);
      Object.assign(dog,{driving:true,targetX:tx,targetY:ty,maxSpeed:DOG_MAX,gain:tx===dog.send[0]&&ty===dog.send[1]?2.6:6});
    }
  });
}

/* ---------- drawing ---------- */
const SHADOW='rgba(30,40,20,.25)';
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function label(text,x,y,size=20){
  ctx.font=`600 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=5;ctx.strokeStyle='rgba(30,40,20,.55)';ctx.strokeText(text,x,y);
  ctx.fillStyle='#fff';ctx.fillText(text,x,y);
}
function drawFence(x1,y1,x2,y2,wood='#8a5a32'){
  ctx.lineCap='round';
  ctx.strokeStyle=SHADOW;ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x1+2,y1+3);ctx.lineTo(x2+2,y2+3);ctx.stroke();
  ctx.strokeStyle=wood;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const posts=Math.max(1,Math.round(Math.hypot(x2-x1,y2-y1)/28));
  ctx.fillStyle='#5b3a1f';
  for(let i=0;i<=posts;i++){const x=x1+(x2-x1)*i/posts,y=y1+(y2-y1)*i/posts;ctx.fillRect(x-3.5,y-3.5,7,7);}
}
// Sprites grow a little when the view zooms out, so the animals stay readable on big fields.
const artScale=()=>1+Math.max(0,1-zoom)*.6;
// Animation state lives on the sim's own objects under `anim`; the simulation never reads it.
const anim=o=>o.anim??={walk:Math.random()*20,graze:0,blinkAt:Math.random()*4};
function animate(dt,t){
  for(const s of world.sheep){
    const a=anim(s),speed=Math.hypot(s.vx,s.vy);
    if(a.bell&&speed>30&&Math.floor((a.walk+speed*dt)/45)!==Math.floor(a.walk/45)&&inView(s.x,s.y,viewRect(0)))tinkle(speed);
    a.walk+=speed*dt;
    a.graze+=((!s.penned&&s.fear<.12&&speed<14?1:0)-a.graze)*Math.min(1,dt*2.5); // calm and still: head down, grazing
    a.calm=s.fear<.08&&speed<6?(a.calm||0)+dt:0; // about one sheep in three lies down after a long calm spell
    a.lying=a.calm>7&&(a.lazy??=Math.random()<.35);
    if(t>a.blinkAt+.15)a.blinkAt=t+2+Math.random()*4;
    leavePrints(s,a,speed);
  }
  for(const d of world.dogs){const a=anim(d),speed=Math.hypot(d.vx,d.vy);a.walk+=speed*dt;a.idle=speed<5?(a.idle||0)+dt:0;leavePrints(d,a,speed);if(mode==='play')runStats.run+=speed*dt;}
}

const WOOL='#f6f3ea',LAMB_WOOL='#fffdf6',BLACK_WOOL='#45403c';
// Wool is drawn once per kind into a small picture, at 4x so it stays crisp when zoomed and on retina screens.
const WOOL_R=12,woolSprites={};
function woolSprite(kind){
  if(woolSprites[kind])return woolSprites[kind];
  const k=4,c=document.createElement('canvas');c.width=c.height=WOOL_R*2*k;
  const g=c.getContext('2d');g.scale(k,k);g.translate(WOOL_R,WOOL_R);
  const black=kind==='black';
  g.fillStyle=black?BLACK_WOOL:kind==='lamb'?LAMB_WOOL:WOOL;g.strokeStyle=black?'#2b2725':'#cfc7b2';g.lineWidth=1.2;
  for(const [x,y,r] of [[-5,-3,5],[-5,3,5],[0,-4,5],[0,4,5],[4,0,5.5],[-1,0,6]]){g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke();}
  g.fillStyle=black?'rgba(255,255,255,.08)':'rgba(255,255,255,.7)';
  for(const [x,y,r] of [[-2,-1.5,3.4],[2.5,-1,2.2]]){g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  return woolSprites[kind]=c;
}
const LEG='#2e2724';
function drawSheep(s,t){
  const a=anim(s),lamb=s.kind===LAMB,speed=Math.hypot(s.vx,s.vy),still=reducedMotion;
  if(a.faintUntil>t)return drawFainted(s,a,t);
  if(a.lying&&!still)return drawLying(s,a,t);
  const hop=still?0:s.hopTime>0?Math.sin(s.hopTime/.4*Math.PI)*5:0;
  const cheer=!still&&s.penned&&s.penned.shut?Math.max(0,Math.sin(t*6+s.wanderAngle*5))**10*7:0; // a full pen bounces
  const lift=hop+cheer,k=artScale()*(lamb?.62:1);
  ctx.fillStyle='rgba(30,40,20,.22)';ctx.beginPath();ctx.ellipse(s.x+1,s.y+3*k,(11-lift*.3)*k,(8-lift*.2)*k,s.heading,0,7);ctx.fill();
  ctx.save();ctx.translate(s.x,s.y-lift);ctx.rotate(s.heading);ctx.scale(k,k);
  // legs peek out under the wool, swinging in diagonal pairs as it walks
  const swing=still?0:Math.sin(a.walk*.32)*Math.min(1,speed/40)*3;
  ctx.fillStyle=LEG;ctx.beginPath();
  for(const [x,y,sgn] of [[7,-5,1],[-7,5,1],[7,5,-1],[-7,-5,-1]]){ctx.moveTo(x+swing*sgn+2,y*1.12);ctx.ellipse(x+swing*sgn,y*1.12,2,1.6,0,0,7);}
  ctx.fill();
  // wool, from a picture drawn once (it breathes a little)
  const breathe=still?1:1+Math.sin(t*2.2+s.wanderAngle)*.03,sprite=woolSprite(a.black?'black':lamb?'lamb':'ewe');
  ctx.drawImage(sprite,-WOOL_R*breathe,-WOOL_R*breathe,WOOL_R*2*breathe,WOOL_R*2*breathe);
  // head: down and nibbling while it grazes, up with ears back when scared
  const nibble=still?0:a.graze*Math.max(0,Math.sin(t*8+s.wanderAngle*3))*1.2;
  const hx=10+a.graze*1.8+nibble,ears=.6+.7*Math.min(1,s.fear*1.6);
  if(a.bell){ // the bellwether's collar and bell, swinging as she walks
    const sw=still?0:Math.sin(a.walk*.32)*1.2;
    ctx.strokeStyle='#b3402f';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(7.5,-4.5);ctx.quadraticCurveTo(9,0,7.5,4.5);ctx.stroke();
    ctx.fillStyle='#e0b13c';ctx.beginPath();ctx.ellipse(9.2,sw,2,1.6,0,0,7);ctx.fill();ctx.fillStyle='#8a6a1c';circle(10.2,sw,.6);
  }
  ctx.fillStyle=lamb?'#6b5248':'#3a322e';
  ctx.beginPath();ctx.ellipse(hx,0,4.5-a.graze*.4,3.6-a.graze*.3,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(hx-1.5-ears*.8,-4,1.6,2.8,ears,0,7);ctx.moveTo(hx-1.5-ears*.8+1.6,4);ctx.ellipse(hx-1.5-ears*.8,4,1.6,2.8,-ears,0,7);ctx.fill();
  if(a.graze<.6&&!(t>a.blinkAt&&t<a.blinkAt+.15)){ // eyes, unless blinking or looking down at the grass
    ctx.fillStyle=s.fear>.5?'#fff':'#e9e4d6';const r=s.fear>.5?1.25:.9;
    ctx.beginPath();ctx.arc(hx+1.2,-1.9,r,0,7);ctx.moveTo(hx+1.2+r,1.9);ctx.arc(hx+1.2,1.9,r,0,7);ctx.fill();
  }
  ctx.restore();
}

// Lying down for a rest: wool spread a little wider, head turned along the body, eyes shut, breathing slowly.
function drawLying(s,a,t){
  const k=artScale()*(s.kind===LAMB?.62:1),breathe=1+Math.sin(t*1.6+s.wanderAngle)*.04;
  ctx.fillStyle='rgba(30,40,20,.2)';ctx.beginPath();ctx.ellipse(s.x+1,s.y+2*k,13*k,10*k,s.heading,0,7);ctx.fill();
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.heading);ctx.scale(k*1.08*breathe,k*1.12*breathe);
  const sprite=woolSprite(a.black?'black':s.kind===LAMB?'lamb':'ewe');
  ctx.drawImage(sprite,-WOOL_R,-WOOL_R,WOOL_R*2,WOOL_R*2);
  ctx.restore();
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.heading);ctx.scale(k,k);
  ctx.fillStyle=s.kind===LAMB?'#6b5248':'#3a322e';
  ctx.beginPath();ctx.ellipse(8,4.5,4.2,3.2,.7,0,7);ctx.fill(); // head laid along its side
  ctx.beginPath();ctx.ellipse(5.6,2,1.4,2.4,1.4,0,7);ctx.fill();
  ctx.strokeStyle='#e9e4d6';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(9.4,5.2);ctx.lineTo(10.6,6.2);ctx.stroke(); // closed eye
  ctx.restore();
}
// Flat on its back, legs in the air, crosses for eyes.
function drawFainted(s,a,t){
  const k=artScale(),twitch=Math.sin(t*20)*.8;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.heading);ctx.scale(k,k);
  ctx.fillStyle='rgba(30,40,20,.22)';ctx.beginPath();ctx.ellipse(1,3,12,9,0,0,7);ctx.fill();
  ctx.strokeStyle=LEG;ctx.lineWidth=2.4;ctx.lineCap='round';
  for(const [x,y] of [[5,-5],[5,5],[-5,-5],[-5,5]]){ctx.beginPath();ctx.moveTo(x*.6,y*.6);ctx.lineTo(x*1.9+twitch,y*2.1);ctx.stroke();}
  ctx.fillStyle=a.black?BLACK_WOOL:WOOL;ctx.strokeStyle='#cfc7b2';ctx.lineWidth=1.2;
  for(const [x,y,r] of [[-4,0,6],[2,0,6.5],[-1,-3,4.5],[-1,3,4.5]]){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();}
  ctx.fillStyle='#3a322e';ctx.beginPath();ctx.ellipse(11,0,4.5,3.6,0,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1;
  for(const y of [-1.8,1.8]){ctx.beginPath();ctx.moveTo(11.4,y-1);ctx.lineTo(13.2,y+1);ctx.moveTo(13.2,y-1);ctx.lineTo(11.4,y+1);ctx.stroke();}
  ctx.restore();
}

// Dogs gallop, wag, stick their tongue out at a sprint and lunge when they bark. A ghost passes a plain {x,y,heading,moving}.
let winAt=null; // real time the last sheep went in: the dogs spin for joy
function drawDog(d,colour,t){
  const a=d.anim,speed=a?Math.hypot(d.vx,d.vy):d.moving?100:0,run=Math.min(1,speed/DOG_MAX),still=reducedMotion;
  const phase=(a?a.walk:t*speed)*.2,k=artScale();
  const spin=!still&&a&&winAt!==null&&t-winAt<.9?(t-winAt)/.9*6.283:0;
  const lunge=a&&d.barkCooldown>BARK_COOLDOWN-.3?1:0;
  if(a&&a.idle>2.5&&!lunge&&!spin&&!still)return drawDogResting(d,colour,t);
  ctx.fillStyle=SHADOW;ctx.beginPath();ctx.ellipse(d.x+1,d.y+3,13*k,7*k,d.heading+spin,0,7);ctx.fill();
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.heading+spin);ctx.scale(k,k);
  ctx.strokeStyle='#1f1d1d';ctx.lineCap='round';ctx.lineWidth=2.8;
  const stride=still?0:Math.sin(phase)*5*run;
  for(const [x,y,sgn] of [[6,-4.5,1],[6,4.5,.6],[-7,-4.5,-1],[-7,4.5,-.6]]){ // gallop: front pair and back pair alternate
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+stride*sgn+2,y*1.5);ctx.stroke();
  }
  const wag=still?0:Math.sin(t*(speed>25?25:8))*(speed>25?.5:.35);
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-11,0);ctx.quadraticCurveTo(-15,3*Math.sin(wag),-19,7*Math.sin(wag));ctx.stroke(); // tail
  ctx.fillStyle='#1f1d1d';ctx.beginPath();ctx.ellipse(-1,0,12,6.5,0,0,7);ctx.fill(); // body
  ctx.fillStyle='#f4f2ec';ctx.beginPath();ctx.ellipse(5,0,4,5,0,0,7);ctx.fill(); // white chest
  ctx.beginPath();ctx.ellipse(-12,0,2.2,1.6,0,0,7);ctx.fill(); // white tail tip
  ctx.strokeStyle=colour;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,-5);ctx.lineTo(8,5);ctx.stroke(); // collar
  const hx=12+lunge*3;
  if(run>.5&&!lunge&&!still){ // tongue flapping out of the side of the mouth
    ctx.fillStyle='#e8708a';ctx.beginPath();ctx.ellipse(hx+5,2.5+Math.sin(t*30)*.6,2.6,1.5,.5,0,7);ctx.fill();
  }
  ctx.fillStyle='#1f1d1d';circle(hx,0,5.2); // head
  ctx.fillStyle='#f4f2ec';ctx.beginPath();ctx.ellipse(hx+3.5,0,2.6,2,0,0,7);ctx.fill(); // muzzle
  if(lunge){ctx.fillStyle='#7a2230';ctx.beginPath();ctx.ellipse(hx+5.2,0,1.8,1.3,0,0,7);ctx.fill();} // open mouth
  const flop=still?0:Math.sin(phase*2)*.35*run;
  ctx.fillStyle='#1f1d1d';ctx.beginPath();ctx.ellipse(hx-2-run*1.5,-4.6,2.2,3,-.5-run*.6+flop,0,7);ctx.ellipse(hx-2-run*1.5,4.6,2.2,3,.5+run*.6-flop,0,7);ctx.fill(); // ears
  ctx.fillStyle='#f4f2ec';circle(hx+1.6,-1.8,.9);circle(hx+1.6,1.8,.9); // eyes
  ctx.restore();
}

// A dog left standing lies down: front paws out, chin up, panting.
function drawDogResting(d,colour,t){
  const k=artScale(),pant=Math.sin(t*9)*.5+.5;
  ctx.fillStyle=SHADOW;ctx.beginPath();ctx.ellipse(d.x+1,d.y+2,12*k,8*k,d.heading,0,7);ctx.fill();
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.heading);ctx.scale(k,k);
  ctx.strokeStyle='#1f1d1d';ctx.lineCap='round';ctx.lineWidth=2.8;
  for(const y of [-3,3]){ctx.beginPath();ctx.moveTo(8,y);ctx.lineTo(16,y*1.1);ctx.stroke();} // front paws stretched out
  ctx.fillStyle='#f4f2ec';circle(16.5,-3.3,1.5);circle(16.5,3.3,1.5); // white feet
  const wag=Math.sin(t*4)*.3;
  ctx.strokeStyle='#1f1d1d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-9,2);ctx.quadraticCurveTo(-13,6,-16,7+4*wag);ctx.stroke();
  ctx.fillStyle='#1f1d1d';ctx.beginPath();ctx.ellipse(-1,1,10.5,7.5,.1,0,7);ctx.fill(); // body curled a little
  ctx.fillStyle='#f4f2ec';ctx.beginPath();ctx.ellipse(5,0,3.5,4.5,0,0,7);ctx.fill();
  ctx.strokeStyle=colour;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(7,-4.5);ctx.lineTo(7,4.5);ctx.stroke();
  ctx.fillStyle='#e8708a';ctx.beginPath();ctx.ellipse(16.5,1.5,1.6+pant*.8,1.2,.3,0,7);ctx.fill(); // panting
  ctx.fillStyle='#1f1d1d';circle(11,0,5.2);
  ctx.fillStyle='#f4f2ec';ctx.beginPath();ctx.ellipse(14.5,0,2.6,2,0,0,7);ctx.fill();
  ctx.fillStyle='#1f1d1d';ctx.beginPath();ctx.ellipse(9,-4.6,2.2,3,-.5,0,7);ctx.ellipse(9,4.6,2.2,3,.5,0,7);ctx.fill();
  ctx.fillStyle='#f4f2ec';circle(12.6,-1.8,.9);circle(12.6,1.8,.9);
  ctx.restore();
}

// what the camera sees, in field coordinates, with a margin so things at the edge are not cut short
function viewRect(margin=60){
  return [cam.x-margin,cam.y-margin,cam.x+FIELD_W/zoom+margin,cam.y+FIELD_H/zoom+margin];
}
const inView=(x,y,[x0,y0,x1,y1])=>x>x0&&x<x1&&y>y0&&y<y1;

function drawGround(now){
  const t=now/1000,view=viewRect(),[vx0,vy0,vx1,vy1]=view;
  // beyond the field: rough grass, then the trees along the field wall
  ctx.fillStyle='#5f7d45';ctx.fillRect(vx0,vy0,vx1-vx0,vy1-vy0);
  const snow=level.weather==='snow';
  ctx.fillStyle=snow?'#dce6ed':'#86a663';ctx.fillRect(0,0,world.W,world.H);
  ctx.fillStyle=snow?'#d3dee7':'#7f9e5d'; // mown stripes (drifts, in snow)
  for(let x=Math.max(0,Math.floor(vx0/80)*80);x<Math.min(world.W,vx1);x+=80)ctx.fillRect(x,0,Math.min(40,world.W-x),world.H);
  const sway=reducedMotion?0:1;
  ctx.strokeStyle=snow?'#b9c8d3':'#6d8c4e';ctx.lineWidth=1.5;ctx.beginPath();
  for(const [x,y,flower] of grass){
    if(flower||!inView(x,y,view)||snow&&x%3<2)continue; // in snow only a few tufts poke through
    const lean=sway*Math.sin(t*1.6+x*.013+y*.007)*1.6; // wind waves across the field
    ctx.moveTo(x-3+lean,y-4);ctx.lineTo(x,y);ctx.lineTo(x+3+lean,y-4);ctx.moveTo(x+lean*1.3,y-6);ctx.lineTo(x,y);
  }
  ctx.stroke();
  for(const [x,y,flower] of grass){
    if(!flower||snow||!inView(x,y,view))continue;
    ctx.fillStyle=flower;for(let i=0;i<5;i++)circle(x+Math.cos(i*1.257)*2.2,y+Math.sin(i*1.257)*2.2,1.5);
    ctx.fillStyle='#e0a83a';circle(x,y,1.2);
  }
  for(const [x,y,w,h] of world.mud){
    ctx.fillStyle='#7a5f3c';ctx.beginPath();ctx.roundRect(x,y,w,h,18);ctx.fill();
    ctx.fillStyle='#6a5032';
    for(let i=0;i<w*h/900;i++){const u=(i*73.1)%w,v=(i*37.7)%h;ctx.beginPath();ctx.ellipse(x+u,y+v,5,3,0,0,7);ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.12)';
    for(let i=0;i<w*h/5000;i++){const u=(i*53.3+20)%(w-20)+10,v=(i*29.9+12)%(h-20)+10;ctx.beginPath();ctx.ellipse(x+u,y+v,6,2.5,0,0,7);ctx.fill();} // puddle glints
  }
  drawPrints(t);
  for(const [x,y,w,h] of world.water){
    ctx.fillStyle='#4f8fb8';ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(30,70,110,.25)';ctx.fillRect(x+6,y+6,w-12,h-12); // deeper in the middle
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
    for(let yy=y+14;yy<y+h;yy+=26)for(let xx=x+8+((yy/26|0)%2)*14;xx<x+w-14;xx+=30){ // ripples, drifting downstream
      if(!inView(xx,yy,view))continue;
      const drift=(t*8+xx*.3)%26-13;
      ctx.beginPath();ctx.moveTo(xx,yy+drift*.2);ctx.quadraticCurveTo(xx+6,yy-5+Math.sin(t*1.7+xx)*1.5,xx+12,yy+drift*.2);ctx.stroke();
    }
  }
  drawRipples(t);
  for(const [x,y,w,h] of (level.bridges||[])){
    // the deck runs across the river: up and down when the water lies to its left or right
    const vertical=world.water.some(([wx,wy,ww,wh])=>wy<y+h&&wy+wh>y&&(Math.abs(wx+ww-x)<2||Math.abs(wx-x-w)<2));
    ctx.fillStyle='rgba(20,40,60,.3)';ctx.fillRect(x+4,y+5,w,h); // shadow on the water
    ctx.fillStyle='#9b6b3e';ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#7a5230'; // planks
    for(let i=0;i<(vertical?h:w);i+=12)vertical?ctx.fillRect(x,y+i,w,3):ctx.fillRect(x+i,y,3,h);
    ctx.fillStyle='#5b3a1f'; // rails
    if(vertical){ctx.fillRect(x-3,y,4,h);ctx.fillRect(x+w-1,y,4,h);}
    else{ctx.fillRect(x,y-3,w,4);ctx.fillRect(x,y+h-1,w,4);}
  }
  drawFieldWall(view);
}
// A dry-stone wall round the field, and trees beyond it where the view reaches past the edge.
function drawFieldWall(view){
  ctx.lineJoin='round';
  ctx.strokeStyle='rgba(30,40,20,.3)';ctx.lineWidth=12;ctx.strokeRect(-4,-3,world.W+10,world.H+10);
  ctx.strokeStyle='#8f8d80';ctx.lineWidth=10;ctx.strokeRect(-5,-5,world.W+10,world.H+10);
  ctx.strokeStyle='#a9a798';ctx.lineWidth=6;ctx.setLineDash([9,4]);ctx.strokeRect(-5,-5,world.W+10,world.H+10);ctx.setLineDash([]);
  for(const {wall:[x1,y1,x2,y2],stone} of world.panels)if(stone){ // the wall cuts across the field's corners
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(30,40,20,.3)';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x1+1,y1+2);ctx.lineTo(x2+1,y2+2);ctx.stroke();
    ctx.strokeStyle='#8f8d80';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.strokeStyle='#a9a798';ctx.lineWidth=6;ctx.setLineDash([9,4]);ctx.stroke();ctx.setLineDash([]);
  }
  for(const [x,y,r] of trees){
    if(!inView(x,y,view))continue;
    ctx.fillStyle='rgba(20,35,15,.3)';circle(x+r*.35,y+r*.45,r);
    ctx.fillStyle='#3d6129';circle(x,y,r);
    ctx.fillStyle='#4a7232';circle(x-r*.25,y-r*.25,r*.65);
    ctx.fillStyle='#5a8a3c';circle(x-r*.35,y-r*.35,r*.3);
    if(level.weather==='snow'){ctx.fillStyle='rgba(245,250,255,.85)';circle(x-r*.3,y-r*.3,r*.5);circle(x+r*.25,y-r*.1,r*.3);}
  }
}

/* ---------- life: prints in the mud, ripples, birds, butterflies, clouds, chatter, confetti ---------- */
let prints=[],ripples=[],trees=[],clouds=[],birds=[],butterflies=[],bubbles=[],confetti=[];
function leavePrints(o,a,speed){ // a print every 13 px walked through mud; rings every so often while a dog swims
  if(reducedMotion||speed<8)return;
  const step=Math.floor(a.walk/13);
  if(step===a.printStep)return;
  a.printStep=step;
  const snow=level.weather==='snow';
  if(snow&&isSheep(o)&&world.sheep.indexOf(o)%3)return; // in snow every third sheep is enough to fill the field with tracks
  if(snow||inRect(world.mud,o))prints.push({x:o.x+(step%2?3:-3)*Math.sin(o.heading),y:o.y-(step%2?3:-3)*Math.cos(o.heading),a:o.heading,t0:nowS(),dog:!isSheep(o)});
  else if(!isSheep(o)&&inRect(world.water,o)&&step%3===0)ripples.push({x:o.x,y:o.y,t0:nowS()});
  if(prints.length>1500)prints.splice(0,200);
}
function drawPrints(t){
  const snow=level.weather==='snow',life=snow?16:10;
  prints=prints.filter(p=>t-p.t0<life);
  // four batches by age, each one path: newest darkest
  for(let band=0;band<4;band++){
    ctx.fillStyle=snow?`rgba(110,135,165,${.4*(1-band/4)})`:`rgba(60,40,20,${.45*(1-band/4)})`;ctx.beginPath();
    for(const p of prints){
      if(Math.min(3,(t-p.t0)/life*4|0)!==band)continue;
      ctx.moveTo(p.x+2.4,p.y);ctx.ellipse(p.x,p.y,p.dog?2.2:1.8,p.dog?1.6:2.4,p.a,0,7);
    }
    ctx.fill();
  }
}
function drawRipples(t){
  ripples=ripples.filter(r=>t-r.t0<1.2);
  for(const r of ripples){
    const u=clamp((t-r.t0)/1.2,0,1),size=r.drop?.25:1;
    if(r.drop&&u>.5)continue;
    ctx.strokeStyle=`rgba(255,255,255,${(r.drop?.4:.5)*(1-u)})`;ctx.lineWidth=r.drop?1:1.5;
    ctx.beginPath();ctx.ellipse(r.x,r.y,(6+u*22)*size,(4+u*15)*size,0,0,7);ctx.stroke();
  }
  if(ripples.length>300)ripples.splice(0,100);
}

// Everything that only decorates a level, laid out the same way every time it loads.
function dressLevel(){
  const random=rng(levelIndex*131+7),W=world.W,H=world.H;
  trees=[];
  for(let x=-40;x<W+80;x+=55+random()*40)for(const y of [-50-random()*30,H+50+random()*30])trees.push([x,y,22+random()*16]);
  for(let y=30;y<H;y+=55+random()*40)for(const x of [-50-random()*30,W+50+random()*30])trees.push([x,y,22+random()*16]);
  clouds=Array.from({length:Math.max(2,Math.round(W*H/220000))},()=>({x:random()*W,y:random()*H,
    blobs:Array.from({length:4+random()*3|0},()=>[(random()-.5)*160,(random()-.5)*70,40+random()*50])}));
  const open=(x,y)=>!inRect(world.water,{x,y})&&!world.pens.some(P=>x>P.x-20&&x<P.x+P.w+20&&y>P.y-20&&y<P.y+P.h+20)
    &&world.dogs.every(d=>Math.hypot(d.x-x,d.y-y)>200)&&world.sheep.every(s=>Math.hypot(s.x-x,s.y-y)>40);
  const spot=()=>{for(let i=0;i<40;i++){const x=40+random()*(W-80),y=40+random()*(H-80);if(open(x,y))return [x,y];}return [W/2,H/2];};
  birds=Array.from({length:clamp(Math.round(W*H/160000),2,14)},()=>{const [x,y]=spot();return {x,y,z:0,vx:0,vy:0,state:'ground',peckAt:random()*3,face:random()*6.283,perch:null};});
  butterflies=Array.from({length:clamp(Math.round(W*H/200000),2,9)},()=>{const [x,y]=spot();return {x,y,hx:x,hy:y,seed:random()*100,colour:['#fff6c8','#f4d35e','#a8d8f0','#f7b2c6'][random()*4|0]};});
  prints=[];ripples=[];bubbles=[];confetti=[];
  world.sheep.forEach((s,i)=>{anim(s).black=s.kind===EWE&&i%29===13;}); // one ewe in about thirty is a black sheep
  const bell=world.sheep.find((s,i)=>s.kind===EWE&&!anim(s).black&&i>=world.sheep.length/3); // and one wears a bell
  if(bell)anim(bell).bell=true;
}

const WIND={x:14,y:5}; // px per second the cloud shadows drift
function updateLife(dt,t){
  if(reducedMotion)return;
  for(const c of clouds){
    c.x+=WIND.x*dt;c.y+=WIND.y*dt;
    if(c.x>world.W+200)c.x=-200;
    if(c.y>world.H+120)c.y=-120;
  }
  for(const b of birds)updateBird(b,dt,t);
  if(farmOf(levelIndex)==='Wet ground')for(let i=0;i<3;i++)if(Math.random()<dt*12){ // raindrops splashing in view
    const [x0,y0,x1,y1]=viewRect(0);ripples.push({x:x0+Math.random()*(x1-x0),y:y0+Math.random()*(y1-y0),t0:t,drop:true});
  }
  for(const f of butterflies){ // flutter round home, drift off when something big comes close
    const near=[...world.dogs,...world.sheep].find(o=>Math.hypot(o.x-f.x,o.y-f.y)<40);
    if(near){f.hx+=(f.x-near.x)*.5;f.hy+=(f.y-near.y)*.5;f.hx=clamp(f.hx,20,world.W-20);f.hy=clamp(f.hy,20,world.H-20);}
    f.x+=((f.hx+Math.sin(t*.9+f.seed)*40-f.x)*1.5+Math.sin(t*7+f.seed)*30)*dt;
    f.y+=((f.hy+Math.cos(t*.7+f.seed)*30-f.y)*1.5+Math.cos(t*9+f.seed)*30)*dt;
  }
  for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.z+=c.vz*dt;c.vz-=260*dt;c.vx*=.99;c.vy*=.99;if(c.z<0){c.z=0;c.vz=0;c.vx*=.6;c.vy*=.6;}c.spin+=c.spinV*dt;}
  confetti=confetti.filter(c=>t-c.t0<4);
}
// Crows peck about, take off when a dog comes near or the flock rushes past, and sometimes ride a calm sheep.
function updateBird(b,dt,t){
  const threat=world.dogs.find(d=>Math.hypot(d.x-b.x,d.y-b.y)<(d.sprint>.3?190:110))
    ||world.sheep.find(s=>!s.penned&&Math.hypot(s.vx,s.vy)>70&&Math.hypot(s.x-b.x,s.y-b.y)<30);
  if(b.state==='ground'||b.state==='perch'){
    if(b.state==='perch'){
      const s=b.perch;b.x=s.x-Math.cos(s.heading)*2;b.y=s.y-Math.sin(s.heading)*2-3;b.face=s.heading;
      if(s.fear>.3||s.penned||threat)takeOff(b,threat||s);
      return;
    }
    if(threat)return takeOff(b,threat);
    if(t>b.peckAt+.25&&Math.random()<dt*.8){b.peckAt=t;b.face+=(Math.random()-.5)*1.5;} // peck, and turn a little
    if(Math.random()<dt*.15){b.x+=Math.cos(b.face)*8;b.y+=Math.sin(b.face)*8;} // a hop
    if(Math.random()<dt*.04){ // hop up on a sheep's back
      const s=world.sheep.find(s=>!s.penned&&s.fear<.1&&s.kind===EWE&&Math.hypot(s.x-b.x,s.y-b.y)<45&&!birds.some(o=>o.perch===s));
      if(s){b.state='perch';b.perch=s;sayIf(s,['…','hey!','get off','who’s up there?'],.7,t);}
    }
    return;
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.state==='fly'){
    b.z+=50*dt;
    if(b.z>140)Object.assign(b,{state:'away',back:t+5+Math.random()*10});
  }else if(b.state==='away'){
    if(t<b.back)return;
    // land again somewhere quiet, gliding in from up high
    for(let i=0;i<20;i++){
      const x=40+Math.random()*(world.W-80),y=40+Math.random()*(world.H-80);
      if(world.dogs.some(d=>Math.hypot(d.x-x,d.y-y)<300)||inRect(world.water,{x,y})||world.pens.some(P=>x>P.x&&x<P.x+P.w&&y>P.y&&y<P.y+P.h))continue;
      const from=Math.random()*6.283;
      Object.assign(b,{state:'land',tx:x,ty:y,x:x+Math.cos(from)*260,y:y+Math.sin(from)*260,z:120,vx:-Math.cos(from)*150,vy:-Math.sin(from)*150,face:from+Math.PI});
      break;
    }
  }else if(b.state==='land'){
    const left=Math.hypot(b.tx-b.x,b.ty-b.y);
    b.z=Math.min(b.z,left*.45);
    if(left<6||threat&&left<80){Object.assign(b,{state:threat?'fly':'ground',x:b.tx,y:b.ty,z:0,vx:0,vy:0});if(threat)takeOff(b,threat);}
  }
}
function takeOff(b,from){
  if(b.state!=='fly'&&inView(b.x,b.y,viewRect(0)))caw();
  const dx=b.x-from.x,dy=b.y-from.y,d=Math.hypot(dx,dy)||1,turn=(Math.random()-.5)*.8;
  const ux=dx/d*Math.cos(turn)-dy/d*Math.sin(turn),uy=dx/d*Math.sin(turn)+dy/d*Math.cos(turn);
  Object.assign(b,{state:'fly',vx:ux*190,vy:uy*190,face:Math.atan2(uy,ux),perch:null,z:Math.max(b.z,4)});
}
function drawBirds(t,shadows){
  for(const b of birds){
    if(b.state==='away')continue;
    if(shadows){if(b.z>0){ctx.fillStyle=`rgba(30,40,20,${.25*Math.max(0,1-b.z/160)})`;ctx.beginPath();ctx.ellipse(b.x+b.z*.5,b.y+b.z*.7,5,3,b.face,0,7);ctx.fill();}continue;}
    const air=b.state==='fly'||b.state==='land',scale=artScale()*(1+b.z/220);
    ctx.save();ctx.translate(b.x,b.y-(b.state==='perch'?2:0));ctx.rotate(b.face);ctx.scale(scale,scale);
    if(!air){ctx.fillStyle='rgba(30,40,20,.25)';ctx.beginPath();ctx.ellipse(1,2,6,3.5,0,0,7);ctx.fill();}
    ctx.fillStyle='#232326';
    if(air){ // flapping wings
      const flap=Math.sin(t*(b.state==='land'?14:22)+b.x)*.9;
      for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-2,side*(5+flap*4),-5,side*(9+flap*5));ctx.quadraticCurveTo(-1,side*4,2,0);ctx.fill();}
    }
    ctx.beginPath();ctx.ellipse(0,0,5,2.8,0,0,7);ctx.fill(); // body
    ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-8,-2.2);ctx.lineTo(-8,2.2);ctx.fill(); // tail
    const peck=!air&&t-b.peckAt<.25?2:0;
    circle(4.5+peck,0,2.2); // head
    ctx.fillStyle='#e0b13c';ctx.beginPath();ctx.moveTo(6.4+peck,-.8);ctx.lineTo(9+peck,0);ctx.lineTo(6.4+peck,.8);ctx.fill(); // beak
    ctx.restore();
  }
}
function drawButterflies(t){
  for(const f of butterflies){
    const flap=Math.abs(Math.sin(t*16+f.seed)),s=artScale();
    ctx.fillStyle=f.colour;
    ctx.beginPath();ctx.ellipse(f.x-2.2*flap*s,f.y,2.4*flap*s+.4,3*s,0,0,7);ctx.ellipse(f.x+2.2*flap*s,f.y,2.4*flap*s+.4,3*s,0,0,7);ctx.fill();
    ctx.fillStyle='#3a322e';ctx.fillRect(f.x-.5,f.y-2.5*s,1,5*s);
  }
}
function drawClouds(){
  if(reducedMotion)return;
  ctx.fillStyle='rgba(25,40,20,.075)';
  for(const c of clouds){ctx.beginPath();for(const [u,v,r] of c.blobs){ctx.moveTo(c.x+u+r,c.y+v);ctx.ellipse(c.x+u,c.y+v,r,r*.75,0,0,7);}ctx.fill();}
}

// Speech bubbles: now and then a sheep says what it thinks.
const LINES={
  happy:['home!','comfy','straw!','finally','nice pen','baa!','safe'],
  scared:['eek!','nope','run!','wolf?!','not again','baa!!','MUM'],
  idle:['munch','baa','meh','grass','nom','…','lovely day'],
  lost:['hello?','guys?','where is everyone?','baa?'],
  wrong:['oops','wrong pen?','is this mine?'],
  lamb:['mum!','wheee','boing','can we go?'],
};
function sayIf(s,lines,chance,t){
  if(!s||Math.random()>chance||bubbles.length>=3||bubbles.some(b=>Math.hypot(b.who.x-s.x,b.who.y-s.y)<70))return; // one voice per patch of field
  bubbles.push({who:s,text:lines[Math.random()*lines.length|0],t0:t});
  runStats.said++;
}
function drawBubbles(t){
  bubbles=bubbles.filter(b=>t-b.t0<1.9);
  const size=12/zoom;
  ctx.font=`600 ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of bubbles){
    const u=t-b.t0,pop=Math.min(1,u/.12),fade=Math.min(1,(1.9-u)/.3);
    const x=b.who.x,y=b.who.y-22*artScale()-size*.9,w=ctx.measureText(b.text).width+size*.9,h=size*1.55;
    ctx.globalAlpha=fade;ctx.save();ctx.translate(x,y);ctx.scale(pop,pop);
    ctx.fillStyle='rgba(30,40,20,.25)';ctx.beginPath();ctx.roundRect(-w/2+1.5,-h/2+2,w,h,h/2);ctx.fill();
    ctx.fillStyle='#fffdf4';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,h/2);ctx.moveTo(-3,h/2-1);ctx.lineTo(0,h/2+5);ctx.lineTo(4,h/2-1);ctx.fill();
    ctx.fillStyle='#3a322e';ctx.fillText(b.text,0,1);
    ctx.restore();ctx.globalAlpha=1;
  }
}
let nextChat=4;
let runStats={run:0,barks:0,faints:0,said:0}; // for a line of nonsense on the results card
function chatter(t){ // a calm sheep remarks on its day; on an open field a lost one calls for the flock
  if(t<nextChat||mode!=='play'&&mode!=='ready')return;
  nextChat=t+3+Math.random()*4;
  const free=world.sheep.filter(s=>!s.penned);
  if(!free.length)return;
  const s=free[Math.random()*free.length|0];
  if(world.open&&!free.some(o=>o!==s&&Math.hypot(o.x-s.x,o.y-s.y)<150))return sayIf(s,LINES.lost,.9,t);
  if(s.fear<.15)sayIf(s,s.kind===LAMB?LINES.lamb:LINES.idle,.6,t);
}

// The last sheep is in: confetti and wool fly out of every pen.
const CONFETTI=['#efbd4c','#ef7b6b','#71bdf0','#9bd47a','#f7b2c6','#ffffff'];
function celebrate(t){
  winAt=t;
  if(reducedMotion)return;
  for(const P of world.pens)for(let i=0;i<70;i++){
    const a=Math.random()*6.283,v=60+Math.random()*160;
    confetti.push({x:P.x+P.w/2,y:P.y+P.h/2,z:10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:160+Math.random()*200,
      colour:CONFETTI[i%CONFETTI.length],spin:Math.random()*6,spinV:(Math.random()-.5)*20,t0:t,wool:i%7===0});
  }
}
function drawConfetti(t){
  for(const c of confetti){
    const fade=Math.min(1,(4-(t-c.t0))/.8);
    ctx.globalAlpha=fade;
    if(c.wool){ctx.fillStyle='#fffdf6';circle(c.x,c.y-c.z,3.5);continue;}
    ctx.save();ctx.translate(c.x,c.y-c.z);ctx.rotate(c.spin);ctx.scale(1,Math.cos(c.spin*1.7));
    ctx.fillStyle=c.colour;ctx.fillRect(-3,-1.6,6,3.2);ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawPens(){
  for(const P of world.pens){
    ctx.fillStyle='#b6a26a';ctx.fillRect(P.x,P.y,P.w,P.h);
    ctx.fillStyle='rgba(120,95,50,.25)';for(let y=P.y+6;y<P.y+P.h;y+=12)ctx.fillRect(P.x+4,y,P.w-8,2); // straw
    // a water trough along the back wall and a hay bale in a back corner
    const along=P.gate==='left'||P.gate==='right',tw=Math.min(70,(along?P.h:P.w)*.4);
    const [tx,ty]={left:[P.x+P.w-16,P.y+P.h/2-tw/2],right:[P.x+6,P.y+P.h/2-tw/2],top:[P.x+P.w/2-tw/2,P.y+P.h-16],bottom:[P.x+P.w/2-tw/2,P.y+6]}[P.gate];
    ctx.fillStyle='#6d6a62';along?ctx.fillRect(tx,ty,10,tw):ctx.fillRect(tx,ty,tw,10);
    ctx.fillStyle='#6fa6c8';along?ctx.fillRect(tx+2,ty+2,6,tw-4):ctx.fillRect(tx+2,ty+2,tw-4,6);
    const [hx,hy]={left:[P.x+P.w-34,P.y+8],right:[P.x+8,P.y+8],top:[P.x+8,P.y+P.h-34],bottom:[P.x+8,P.y+8]}[P.gate];
    ctx.fillStyle='#d9b85c';ctx.fillRect(hx,hy,26,18);ctx.fillStyle='#c09a3e';ctx.fillRect(hx,hy+5,26,2);ctx.fillRect(hx,hy+11,26,2);
    // how many are in: a sorting pen counts only its own kind
    const sorting=P.kind!==undefined,k=artScale();
    const have=world.sheep.filter(s=>s.penned===P).length,need=sorting?world.sheep.filter(s=>s.kind===P.kind).length:world.sheep.length;
    ctx.globalAlpha=.6;
    if(sorting)label(P.kind===LAMB?'LAMBS':'EWES',P.x+P.w/2,P.y+P.h/2-10*k,16*k);
    label(`${have}/${need}`,P.x+P.w/2,P.y+P.h/2+(sorting?10*k:0),(sorting?14:16)*k);
    ctx.globalAlpha=1;
  }
}
// Trial hurdles: white rails between posts with a flag on top, the way through dashed between each pair,
// numbered in order with how many have gone through; a tick once done. A locked pen gate gets a padlock.
function drawCourse(t){
  world.course.forEach((o,k)=>{
    const [ax,ay]=o.a,[bx,by]=o.b,mx=(ax+bx)/2,my=(ay+by)/2,need=Math.ceil(world.sheep.length*COURSE_SHARE);
    ctx.strokeStyle=o.done?'rgba(155,212,122,.8)':'rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.setLineDash([5,7]);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);
    for(const [x1,y1,x2,y2] of world.hurdles.slice(k*2,k*2+2)){
      ctx.lineCap='round';
      ctx.strokeStyle=SHADOW;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x1+2,y1+3);ctx.lineTo(x2+2,y2+3);ctx.stroke();
      ctx.strokeStyle='#f4f2ec';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.strokeStyle='#c9433a';ctx.lineWidth=5;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#5b3a1f';ctx.fillRect(x1-3.5,y1-3.5,7,7);ctx.fillRect(x2-3.5,y2-3.5,7,7);
      const wave=reducedMotion?0:Math.sin(t*5+x1)*2; // a flag on the end post
      ctx.fillStyle=k%2?'#efbd4c':'#c9433a';ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2+12,y2-4+wave);ctx.lineTo(x2,y2-8);ctx.fill();
    }
    const k2=artScale();
    ctx.fillStyle=o.done?'#9bd47a':'rgba(18,23,16,.65)';circle(mx,my,12*k2);
    ctx.font=`700 ${13*k2}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=o.done?'#1f2a17':'#fff';
    ctx.fillText(o.done?'✓':k+1,mx,my+.5);
    if(!o.done)label(`${Math.min(o.crossed.size,need)}/${need}`,mx,my+24*k2,12*k2);
  });
  for(const P of world.pens)if(P.locked){
    const [x1,y1,x2,y2]=gateOpening(P),x=(x1+x2)/2,y=(y1+y2)/2,k=artScale();
    ctx.fillStyle='#e0b13c';ctx.fillRect(x-6*k,y-3*k,12*k,10*k);
    ctx.strokeStyle='#e0b13c';ctx.lineWidth=2.5*k;ctx.beginPath();ctx.arc(x,y-3*k,4*k,Math.PI,0);ctx.stroke();
  }
}
// Two gate leaves, swung outward like a funnel while open, swing shut (with a little bounce) once the pen is complete.
const GATE_SWING=.45;          // seconds
const GATE_OPEN=Math.PI*.62;   // open leaf angle from shut, slightly past square so the gate flares
function drawGates(t){
  for(const P of world.pens){
    const [x1,y1,x2,y2]=gateOpening(P),len=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/len,uy=(y2-y1)/len;
    let nx=(x1+x2)/2-(P.x+P.w/2),ny=(y1+y2)/2-(P.y+P.h/2); // outward from the pen
    const nl=Math.hypot(nx,ny);nx/=nl;ny/=nl;
    const u=P.locked?1:gateShut.has(P)?clamp((t-gateShut.get(P))/GATE_SWING,0,1):0; // a locked gate stands shut
    const closed=1+2.2*(u-1)**3+1.2*(u-1)**2; // ease out with overshoot
    const angle=GATE_OPEN*(1-closed);         // GATE_OPEN: open, 0: shut
    for(const [hx,hy,side] of [[x1,y1,1],[x2,y2,-1]]){
      const dx=side*ux*Math.cos(angle)+nx*Math.sin(angle),dy=side*uy*Math.cos(angle)+ny*Math.sin(angle);
      drawFence(hx,hy,hx+dx*len/2,hy+dy*len/2,'#c08c55');
    }
  }
}
function drawRocks(){
  for(const [cx,cy,r] of world.rocks){
    ctx.fillStyle=SHADOW;ctx.beginPath();ctx.ellipse(cx+4,cy+6,r,r*.85,0,0,7);ctx.fill();
    ctx.fillStyle='#8f938a';circle(cx,cy,r);
    ctx.fillStyle='#a6aaa0';circle(cx-r*.25,cy-r*.3,r*.55);
    ctx.fillStyle='#b8bbb1';circle(cx-r*.38,cy-r*.42,r*.22);
    ctx.fillStyle='rgba(95,125,60,.55)';circle(cx+r*.45,cy+r*.35,r*.28);circle(cx+r*.2,cy+r*.55,r*.18); // moss on the shady side
    ctx.strokeStyle='rgba(60,62,58,.5)';ctx.lineWidth=1.5;ctx.beginPath(); // a crack
    ctx.moveTo(cx+r*.1,cy-r*.75);ctx.lineTo(cx+r*.25,cy-r*.35);ctx.lineTo(cx+r*.12,cy-r*.05);ctx.stroke();
    if(level.weather==='snow'){ctx.fillStyle='rgba(248,251,255,.92)';circle(cx-r*.2,cy-r*.25,r*.62);}
  }
}
// Each dog's scare range: solid disc (grows and turns red while sprinting) and the dashed walking range.
// The dogs you are not steering show theirs fainter.
function drawRanges(){
  world.dogs.forEach((dog,i)=>{
    const colour=dog.sprint>.3?SPRINT_COLOUR:DOG_COLOURS[i],focus=i===selected?1:.55;
    ctx.globalAlpha=(.10+.08*dog.sprint)*focus;ctx.fillStyle=colour;circle(dog.x,dog.y,dog.range);
    ctx.globalAlpha=.35*focus;ctx.strokeStyle=colour;ctx.lineWidth=1.5;ctx.setLineDash([5,7]);
    ctx.beginPath();ctx.arc(dog.x,dog.y,RMIN,0,7);ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.globalAlpha=1;
}
function kickDust(t){ // puffs behind a sprinting dog
  if(reducedMotion)return;
  for(const dog of world.dogs)if(dog.sprint>.4&&Math.hypot(dog.vx,dog.vy)>80&&Math.random()<.45)
    dust.push({x:dog.x-Math.cos(dog.heading)*12+(Math.random()-.5)*8,y:dog.y-Math.sin(dog.heading)*12+(Math.random()-.5)*8,t0:t});
}
function drawDust(t){
  dust=dust.filter(p=>t-p.t0<.6);
  for(const p of dust){const u=(t-p.t0)/.6;ctx.fillStyle=`rgba(225,214,170,${.4*(1-u)})`;circle(p.x,p.y,3+9*u);}
}
// position and direction on a recorded path at time t, between the samples
function ghostAt(path,t){
  const last=path.length/2-1,f=clamp(t*GHOST_HZ,0,last),i=Math.min(Math.floor(f),Math.max(0,last-1)),u=last?f-i:0;
  const x0=path[2*i],y0=path[2*i+1],x1=path[2*i+2]??x0,y1=path[2*i+3]??y0;
  return {x:x0+(x1-x0)*u,y:y0+(y1-y0)*u,vx:x1-x0,vy:y1-y0};
}
function drawGhost(t){
  if(!ghost||!ghostOn)return;
  const shown=clockRunning()?world.t:endTime;
  ctx.globalAlpha=.4;
  let top=null;
  ghost.dogs.forEach((path,i)=>{
    const p=ghostAt(path,shown),speed=Math.hypot(p.vx,p.vy)*GHOST_HZ;
    if(speed>5)ghost.headings[i]=Math.atan2(p.vy,p.vx);
    drawDog({x:p.x,y:p.y,heading:ghost.headings[i],moving:speed>25},'#ffffff',t);
    if(i===0)top=p;
  });
  ctx.globalAlpha=.75;
  if(shown>0)label(`${shown>=ghost.time?'✓ ':''}${ghost.name} ${ghost.time.toFixed(1)} s`,top.x,top.y-30,13);
  ctx.globalAlpha=1;
}
// a dashed line from a dog to where it is heading: the held pointer, or a spot the map sent it to
function drawPointerLine(){
  if(mode==='done')return;
  world.dogs.forEach((dog,i)=>{
    const to=i===selected&&pointerHeld&&pointer?pointer:dog.send;
    if(!to)return;
    ctx.strokeStyle=DOG_COLOURS[i];ctx.globalAlpha=.6;ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(dog.x,dog.y);ctx.lineTo(...to);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.lineWidth=3;ctx.beginPath();ctx.arc(to[0],to[1],9,0,7);ctx.stroke();
  });
}
// On a big field, a map of the whole field in the corner. Tap it to send the selected dog there.
function minimapRect(){
  const scale=Math.min(180/world.W,130/world.H),w=world.W*scale,h=world.H*scale; // fits a 180 x 130 corner
  return {x:FIELD_W-w-10,y:FIELD_H-h-10,w,h,scale};
}
function minimapPoint([sx,sy]){
  if(!bigField())return null;
  const m=minimapRect();
  if(sx<m.x||sx>m.x+m.w||sy<m.y||sy>m.y+m.h)return null;
  return [clamp((sx-m.x)/m.scale,DOG_EDGE,world.W-DOG_EDGE),clamp((sy-m.y)/m.scale,DOG_EDGE,world.H-DOG_EDGE)];
}
function drawMinimap(){
  if(!bigField())return;
  const m=minimapRect(),k=m.scale,X=x=>m.x+x*k,Y=y=>m.y+y*k;
  ctx.fillStyle='rgba(18,23,16,.55)';ctx.beginPath();ctx.roundRect(m.x-4,m.y-4,m.w+8,m.h+8,8);ctx.fill();
  ctx.fillStyle={snow:'#c9d6e0',night:'#2c3a3a',fog:'#a9b4ad'}[level.weather]||'#6f8c52';ctx.fillRect(m.x,m.y,m.w,m.h);
  ctx.fillStyle='#7a5f3c';for(const [x,y,w,h] of world.mud)ctx.fillRect(X(x),Y(y),w*k,h*k);
  ctx.fillStyle='#4f8fb8';for(const [x,y,w,h] of world.water)ctx.fillRect(X(x),Y(y),w*k,h*k);
  ctx.fillStyle='#9b6b3e';for(const [x,y,w,h] of (level.bridges||[]))ctx.fillRect(X(x),Y(y),w*k,h*k);
  ctx.fillStyle='#3f6b2c';for(const [x,y,r] of world.bushes)circle(X(x),Y(y),Math.max(1.5,r*k));
  ctx.fillStyle='#a6aaa0';for(const [x,y,r] of world.rocks)circle(X(x),Y(y),Math.max(1.5,r*k));
  ctx.fillStyle='#d8c27e';for(const P of world.pens)ctx.fillRect(X(P.x),Y(P.y),P.w*k,P.h*k);
  ctx.strokeStyle='#5b3a1f';ctx.lineWidth=1.5;
  for(const [x1,y1,x2,y2] of world.walls){ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.stroke();}
  for(const s of world.sheep){ctx.fillStyle=s.kind===LAMB?'#fff6d0':'#ffffff';ctx.fillRect(X(s.x)-1,Y(s.y)-1,2,2);}
  world.dogs.forEach((dog,i)=>{ctx.fillStyle=DOG_COLOURS[i];circle(X(dog.x),Y(dog.y),i===selected?3.5:2.5);});
  if(world.wolf&&world.wolf.state!=='away'){ctx.fillStyle='#ef7b6b';circle(X(world.wolf.x),Y(world.wolf.y),3);}
  ctx.save();ctx.beginPath();ctx.rect(m.x,m.y,m.w,m.h);ctx.clip(); // the view box, cut at the map's edge
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;
  ctx.strokeRect(X(cam.x),Y(cam.y),FIELD_W/zoom*k,FIELD_H/zoom*k);
  ctx.restore();
}
function drawBushes(){ // drawn over the sheep, so hidden sheep are hard to see
  const blobs=[[0,0,1,'#3f6b2c'],[-.45,-.3,.62,'#4c7d35'],[.45,-.25,.6,'#4c7d35'],[-.2,.4,.6,'#46752f'],[.35,.35,.55,'#46752f']];
  ctx.globalAlpha=.88;
  const t=nowS();
  for(const [x,y,r] of world.bushes){
    const busy=!reducedMotion&&world.sheep.some(s=>Math.hypot(s.x-x,s.y-y)<r&&Math.hypot(s.vx,s.vy)>12); // rustles while a sheep pushes through
    const shake=busy?Math.sin(t*38)*1.6:0;
    for(const [u,v,k,colour] of blobs){ctx.fillStyle=colour;circle(x+u*r+shake*(1-k),y+v*r,r*k);}
    if(level.weather==='snow'){ctx.fillStyle='rgba(245,250,255,.85)';circle(x-r*.35+shake,y-r*.35,r*.42);circle(x+r*.3,y-r*.3,r*.3);}
  }
  ctx.globalAlpha=1;
}
function drawBarkRings(t){
  barkRings=barkRings.filter(b=>t-b.t0<.7);
  for(const b of barkRings){
    const u=clamp((t-b.t0)/.7,0,1); // a bark can be stamped a moment after this frame's time
    ctx.strokeStyle=`rgba(255,240,200,${.8*(1-u)})`;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(b.x,b.y,20+u*(BARK_RADIUS-20),0,7);ctx.stroke();
    label('WOOF!',b.x,b.y-30-u*16,18);
  }
}
// The wolf: lean and grey, yellow eyes, tail low while it hunts and tucked in when it runs.
function drawWolf(t){
  const w=world.wolf;
  if(!w||w.state==='away')return;
  const k=artScale()*1.3,speed=Math.hypot(w.vx,w.vy),phase=t*speed*.06,still=reducedMotion;
  // the ground it frightens sheep from, pulsing red while it hunts
  const pulse=w.state==='hunt'&&!still?.5+.5*Math.sin(t*5):0;
  ctx.globalAlpha=.10+.06*pulse;ctx.fillStyle='#ef7b6b';circle(w.x,w.y,WOLF_RANGE);
  ctx.globalAlpha=.4;ctx.strokeStyle='#ef7b6b';ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.arc(w.x,w.y,WOLF_RANGE,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha=1;
  ctx.fillStyle=SHADOW;ctx.beginPath();ctx.ellipse(w.x+1,w.y+3,15*k,7*k,w.heading,0,7);ctx.fill();
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.heading);ctx.scale(k,k);
  ctx.strokeStyle='#4a4a4c';ctx.lineCap='round';ctx.lineWidth=3;
  const stride=still?0:Math.sin(phase)*5*Math.min(1,speed/150);
  for(const [x,y,sgn] of [[7,-5,1],[7,5,.6],[-8,-5,-1],[-8,5,-.6]]){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+stride*sgn+2,y*1.5);ctx.stroke();}
  const tuck=w.state==='flee'?4:0;
  ctx.fillStyle='#6d6c6e';ctx.beginPath();ctx.moveTo(-12,0);ctx.quadraticCurveTo(-20,3-tuck,-25+tuck,6-tuck);ctx.quadraticCurveTo(-19,-1,-12,-3);ctx.fill(); // bushy tail
  ctx.fillStyle='#7c7b7e';ctx.beginPath();ctx.ellipse(-1,0,14,7,0,0,7);ctx.fill(); // body
  ctx.fillStyle='#9a999b';ctx.beginPath();ctx.ellipse(1,0,8,4,0,0,7);ctx.fill(); // lighter back
  ctx.fillStyle='#7c7b7e';ctx.beginPath();ctx.moveTo(10,-5);ctx.lineTo(22,0);ctx.lineTo(10,5);ctx.fill(); // long snout
  circle(12,0,5.5);
  ctx.fillStyle='#5c5b5d';ctx.beginPath();ctx.moveTo(9,-4);ctx.lineTo(7,-9);ctx.lineTo(12,-5);ctx.moveTo(9,4);ctx.lineTo(7,9);ctx.lineTo(12,5);ctx.fill(); // pointed ears
  ctx.fillStyle='#232224';circle(22,0,1.4); // nose
  ctx.fillStyle='#f2c230';circle(14,-2.2,1.2);circle(14,2.2,1.2); // eyes
  ctx.restore();
}
function drawDogs(t){
  world.dogs.forEach((dog,i)=>{
    if(i===selected){ctx.strokeStyle=DOG_COLOURS[i];ctx.lineWidth=3;ctx.beginPath();ctx.arc(dog.x,dog.y,20*artScale(),0,7);ctx.stroke();}
    drawDog(dog,DOG_COLOURS[i],t);
    if(world.dogs.length<2)return;
    const by=dog.y-24*artScale();
    ctx.fillStyle=DOG_COLOURS[i];circle(dog.x,by,8*artScale()); // number badge
    ctx.font=`700 ${11*artScale()}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#2a2410';ctx.fillText(i+1,dog.x,by+.5);
  });
}
function drawPopups(t){ // "+1" for a penned sheep, a red cross for one in the wrong pen
  popups=popups.filter(p=>t-p.t0<1);
  for(const p of popups){
    const u=t-p.t0,scale=u<.15?u/.15*1.4:1.4-.4*Math.min(1,(u-.15)/.2);
    const text=p.text;
    ctx.save();ctx.translate(p.x,p.y-30*u);ctx.scale(scale,scale);ctx.globalAlpha=1-u;
    ctx.font=`700 20px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='#2a2410';ctx.strokeText(text,0,0);
    ctx.fillStyle=p.colour;ctx.fillText(text,0,0);
    ctx.restore();
  }
}
// Two levels teach in three prompts: the first level how to herd, Shepherd's test how a bark splits a flock.
// Each prompt moves on once the player has done it, and points at where to go.
const gateMiddle=P=>{const [x1,y1,x2,y2]=gateOpening(P);return {x:(x1+x2)/2,y:(y1+y2)/2};};
const centreOf=kind=>{const free=world.sheep.filter(s=>s.kind===kind&&!s.penned),n=free.length||1;
  return {x:free.reduce((t,s)=>t+s.x,0)/n,y:free.reduce((t,s)=>t+s.y,0)/n};};
const SPLIT_GAP={x:460,y:250}; // the gap between Shepherd's test's two fences
const TUTORIALS={
  'First sheep':[
    {text:'1/3  Drag from your dog to move it. Close walks, far sprints.',
      target:()=>world.dogs[0],done:()=>Math.hypot(world.dogs[0].x-level.dogs[0][0],world.dogs[0].y-level.dogs[0][1])>40},
    {text:'2/3  Sheep run from your dog. Walk up behind it.',
      target:()=>{const s=world.sheep[0],g=gateMiddle(world.pens[0]),gx=g.x-s.x,gy=g.y-s.y,d=Math.hypot(gx,gy)||1;
        return {x:s.x-gx/d*55,y:s.y-gy/d*55};},
      done:()=>world.sheep[0].fear>.15},
    {text:'3/3  Ease it through the open gate. Sprinting scatters sheep.',target:()=>gateMiddle(world.pens[0]),done:()=>false},
  ],
  'Shepherd’s test':[
    {text:'1/3  Walk up to the flock from this side and press Space to bark.',
      target:()=>{const e=centreOf(EWE),gx=SPLIT_GAP.x-e.x,gy=SPLIT_GAP.y-e.y,d=Math.hypot(gx,gy)||1;
        return {x:e.x-gx/d*110,y:e.y-gy/d*110};},
      done:()=>world.dogs.some(dog=>dog.barkCooldown>0)},
    {text:'2/3  The lambs ran ahead of the ewes. Get them through the gap first.',
      target:()=>SPLIT_GAP,done:()=>centreOf(LAMB).x>SPLIT_GAP.x||world.penned>0},
    {text:'3/3  Lambs down, ewes up. Bark again whenever they mix.',
      target:()=>gateMiddle(world.pens.find(P=>P.kind===LAMB&&!P.shut)||world.pens.find(P=>P.kind===EWE)),done:()=>false},
  ],
};
let tutorialStep=0;
const tutorial=()=>(mode==='ready'||mode==='play')&&world.penned<world.sheep.length?TUTORIALS[level.name]:undefined;
function lesson(){ // the tutorial prompt showing now, if any
  const steps=tutorial();
  if(!steps)return null;
  while(tutorialStep<steps.length-1&&steps[tutorialStep].done())tutorialStep++;
  return steps[tutorialStep];
}
// On a level that needs a second dog as a blocker: a pulsing ring in dog 2's colour where it should stand,
// until it gets there.
function drawBlockerSpot(t){
  const spot=level.blocker,dog=world.dogs[1];
  if(!spot||!dog||mode==='done'||Math.hypot(dog.x-spot[0],dog.y-spot[1])<40)return;
  const pulse=reducedMotion?.5:(t*1.1)%1;
  ctx.strokeStyle=DOG_COLOURS[1];ctx.globalAlpha=.9*(1-pulse);ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(spot[0],spot[1],16+26*pulse,0,7);ctx.stroke();
  ctx.globalAlpha=.85;ctx.setLineDash([4,6]);ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(spot[0],spot[1],16,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=DOG_COLOURS[1];ctx.font=`700 ${14*artScale()}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('2',spot[0],spot[1]+.5);
  ctx.globalAlpha=1;
}
// A dog out of view: an arrow at the edge of the screen pointing to it, in its colour.
function drawOffscreenDogs(){
  world.dogs.forEach((dog,i)=>{
    const sx=(dog.x-cam.x)*zoom,sy=(dog.y-cam.y)*zoom,pad=22;
    if(sx>0&&sy>0&&sx<FIELD_W&&sy<FIELD_H)return;
    const x=clamp(sx,pad,FIELD_W-pad),y=clamp(sy,pad,FIELD_H-pad),a=Math.atan2(sy-y,sx-x);
    ctx.save();ctx.translate(x,y);ctx.rotate(a);
    ctx.fillStyle='rgba(18,23,16,.6)';circle(0,0,13);
    ctx.fillStyle=DOG_COLOURS[i];ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(7,-6);ctx.lineTo(7,6);ctx.fill();
    ctx.rotate(-a);ctx.font=`700 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,0,1);
    ctx.restore();
  });
}
function drawLessonRing(step,t){
  const {x,y}=step.target(),pulse=(t*1.2)%1;
  ctx.strokeStyle=`rgba(255,255,255,${.85*(1-pulse)})`;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y,14+22*pulse,0,7);ctx.stroke();
}
function drawHint(step){
  if(mode==='paused'){
    ctx.fillStyle='rgba(18,23,16,.68)';ctx.fillRect(0,0,FIELD_W,FIELD_H);
    label('Paused',FIELD_W/2,96,40);label('P, Esc or tap to go on',FIELD_W/2,134,18);
    // the controls, two columns
    const rows=[['Drag','run the dog: close walks, far sprints'],['WASD / arrows','walk, Shift sprints'],['Space','bark'],
      ['Q  /  E','circle the flock: come bye / away'],['Tab, 1-3','switch dog'],['Map','tap to send the dog there'],['R  ·  M  ·  G','restart · sound · ghost']];
    ctx.font=`600 15px ${FONT}`;ctx.textBaseline='middle';
    rows.forEach(([key,what],i)=>{
      const y=190+i*30;
      ctx.textAlign='right';ctx.fillStyle='#efbd4c';ctx.fillText(key,FIELD_W/2-14,y);
      ctx.textAlign='left';ctx.fillStyle='#f0f1e6';ctx.fillText(what,FIELD_W/2+2,y);
    });
    return;
  }
  if(step)return label(step.text,FIELD_W/2,34);
  if(mode!=='ready')return;
  const text=level.tip?level.tip
    :level.dogs.length>1?'Drag close to walk, far to sprint. Tab, right-click or tap a dog to switch.'
    :'Drag close to the dog to walk, far ahead to sprint';
  const penAtTop=world.pens.some(P=>(P.y-cam.y)*zoom<60&&(P.x-cam.x)*zoom<520&&(P.x+P.w-cam.x)*zoom>280); // then show the hint at the bottom
  label(text,FIELD_W/2,penAtTop?FIELD_H-30:34);
}
function render(now){
  const t=now/1000,step=lesson();
  ctx.setTransform(DPR*zoom,0,0,DPR*zoom,-cam.x*DPR*zoom,-cam.y*DPR*zoom); // the field, as the camera sees it
  drawGround(now);
  drawButterflies(t);
  drawBirds(t,true);
  drawPens();
  drawRocks();
  const shut=world.pens.filter(P=>P.shut).length; // a shut gate is the last wall added, drawn as leaves instead
  // drawn their own way: corner panels are part of the stone wall, hurdles and locked gates below
  const own=new Set([...world.panels.filter(p=>p.stone).map(p=>p.wall),...world.hurdles,...world.locks]);
  for(const wall of world.walls.slice(0,world.walls.length-shut))if(!own.has(wall))drawFence(...wall);
  drawCourse(t);
  drawGates(t);
  drawDust(t);
  drawRanges();
  drawGhost(t);
  drawPointerLine();
  const view=viewRect(40);
  for(const s of world.sheep)if(inView(s.x,s.y,view))drawSheep(s,t);
  drawBirds(t,false);
  drawWolf(t);
  drawBushes();
  drawBarkRings(t);
  drawDogs(t);
  drawClouds();
  drawConfetti(t);
  drawBubbles(t);
  drawPopups(t);
  if(step)drawLessonRing(step,t);
  drawBlockerSpot(t);
  ctx.setTransform(DPR,0,0,DPR,0,0); // the screen
  drawLight();
  drawWeather(t);
  drawOffscreenDogs();
  drawMinimap();
  drawBanner(t);
  drawHint(step);
}

// Each farm has its own light: morning, noon, rain, evening.
const FARM_LIGHT={'Trial ground':'rgba(255,200,120,.06)','Wet ground':'rgba(70,110,150,.08)','Sorting day':'rgba(255,230,190,.05)',
  'Open hill':'rgba(255,236,190,.07)','Big country':'rgba(255,150,70,.09)'};
// When a level loads: its name, farm and flock size, sliding in and fading away.
let banner=-9;
function drawBanner(t){
  const u=t-banner;
  if(u>2.6||u<0)return;
  const farm=FARMS.find(f=>f.levels.includes(levelIndex)),number=ORDER.indexOf(levelIndex)+1;
  const fade=Math.min(1,(2.6-u)/.5),slide=reducedMotion?0:(1-Math.min(1,u/.35))**3*-40;
  ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(18,23,16,.55)';ctx.beginPath();ctx.roundRect(FIELD_W/2-190,FIELD_H/2-58+slide,380,116,18);ctx.fill();
  label(`${farm.name.toUpperCase()} · ${number}`,FIELD_W/2,FIELD_H/2-30+slide,13);
  label(level.name,FIELD_W/2,FIELD_H/2+2+slide,32);
  const sheep=world.sheep.length,dogs=world.dogs.length;
  label(`${sheep} sheep · ${dogs} ${dogs>1?'dogs':'dog'}`,FIELD_W/2,FIELD_H/2+36+slide,15);
  ctx.globalAlpha=1;
}
const farmOf=i=>FARMS.find(f=>f.levels.includes(i))?.name;
function drawLight(){
  const light=FARM_LIGHT[farmOf(levelIndex)];
  if(light){ctx.fillStyle=light;ctx.fillRect(0,0,FIELD_W,FIELD_H);}
  if(farmOf(levelIndex)==='Wet ground')drawRain(nowS());
}
// Wet ground: a steady drizzle across the screen, with drops splashing on the field (see updateLife)
function drawRain(t,heavy=1){
  if(reducedMotion)return;
  ctx.strokeStyle=`rgba(225,238,255,${.3+.08*heavy})`;ctx.lineWidth=1.2;ctx.beginPath();
  for(let i=0;i<90*heavy;i++){
    const x=((i*97.3+t*70*heavy)%(FIELD_W+40))-20,y=((i*53.9+t*(620+i%5*40)*heavy)%(FIELD_H+40))-20;
    ctx.moveTo(x,y);ctx.lineTo(x-4*heavy,y+13*heavy);
  }
  ctx.stroke();
}

/* ---------- weather: night, fog, snow, storm (see the All weathers levels) ---------- */
// Night and fog: a cover over the screen with soft holes round each dog and each pen.
const cover=document.createElement('canvas');
function drawCover(t,colour,dogLight,penLight){
  if(cover.width!==canvas.width||cover.height!==canvas.height){cover.width=canvas.width;cover.height=canvas.height;}
  const g=cover.getContext('2d'),k=zoom*DPR;
  g.globalCompositeOperation='source-over';g.clearRect(0,0,cover.width,cover.height);
  g.fillStyle=colour;g.fillRect(0,0,cover.width,cover.height);
  g.globalCompositeOperation='destination-out';
  const hole=(x,y,r)=>{
    const sx=(x-cam.x)*k,sy=(y-cam.y)*k,sr=r*k,grad=g.createRadialGradient(sx,sy,sr*.3,sx,sy,sr);
    grad.addColorStop(0,'rgba(0,0,0,1)');grad.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grad;g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
  };
  const flicker=reducedMotion?1:1+Math.sin(t*9)*.02+Math.sin(t*23)*.015;
  for(const d of world.dogs)hole(d.x,d.y,dogLight*flicker);
  for(const P of world.pens)hole(P.x+P.w/2,P.y+P.h/2,penLight*flicker);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(cover,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
}
const toScreenXY=(x,y)=>[(x-cam.x)*zoom,(y-cam.y)*zoom];
const lit=(x,y,r)=>world.dogs.some(d=>Math.hypot(d.x-x,d.y-y)<r)||world.pens.some(P=>Math.hypot(P.x+P.w/2-x,P.y+P.h/2-y)<r*.8);
const NIGHT_LIGHT=170,FOG_LIGHT=250;
function drawNight(t){
  drawCover(t,'rgba(8,12,32,.88)',NIGHT_LIGHT,140);
  // a warm glow round the lantern on each pen
  for(const P of world.pens){
    const [x,y]=toScreenXY(P.x+P.w/2,P.y+P.h/2),g=ctx.createRadialGradient(x,y,0,x,y,120*zoom);
    g.addColorStop(0,'rgba(255,200,110,.18)');g.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=g;ctx.fillRect(x-120*zoom,y-120*zoom,240*zoom,240*zoom);
  }
  // eyes shining in the dark, blinking now and then
  const view=viewRect(0);
  ctx.fillStyle='rgba(215,240,170,.85)';ctx.beginPath();
  for(const s of world.sheep){
    if(s.penned||!inView(s.x,s.y,view)||lit(s.x,s.y,NIGHT_LIGHT*.75))continue;
    const a=anim(s);if(a.faintUntil>t||t>a.blinkAt&&t<a.blinkAt+.15||a.graze>.6)continue;
    const k=artScale()*(s.kind===LAMB?.62:1),c=Math.cos(s.heading),n=Math.sin(s.heading);
    for(const side of [-1,1]){
      const [x,y]=toScreenXY(s.x+(c*11-n*side*2)*k,s.y+(n*11+c*side*2)*k);
      ctx.moveTo(x+1.3,y);ctx.arc(x,y,1.3,0,7);
    }
  }
  ctx.fill();
  // fireflies
  for(const f of butterflies){
    const glow=Math.max(0,Math.sin(t*2.3+f.seed*7));
    if(glow<.05)continue;
    const [x,y]=toScreenXY(f.x,f.y),g=ctx.createRadialGradient(x,y,0,x,y,7);
    g.addColorStop(0,`rgba(240,255,150,${glow})`);g.addColorStop(1,'rgba(240,255,150,0)');ctx.fillStyle=g;ctx.fillRect(x-7,y-7,14,14);
  }
}
function drawFog(t){
  drawCover(t,'rgba(222,228,233,.9)',FOG_LIGHT,190);
  if(reducedMotion)return;
  ctx.fillStyle='rgba(235,239,242,.22)'; // banks of fog rolling past
  for(const c of clouds){const [x,y]=toScreenXY(c.x,c.y);ctx.beginPath();for(const [u,v,rr] of c.blobs){ctx.moveTo(x+(u+rr)*zoom,y+v*zoom);ctx.ellipse(x+u*zoom,y+v*zoom,rr*zoom*1.6,rr*zoom,0,0,7);}ctx.fill();}
}
function drawSnowfall(t){
  if(reducedMotion)return;
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();
  for(let i=0;i<140;i++){
    const r=1+(i%3)*.7,x=((i*83.7+Math.sin(t*.8+i)*18+t*12)%(FIELD_W+20))-10,y=((i*41.3+t*(28+i%4*9))%(FIELD_H+20))-10;
    ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,7);
  }
  ctx.fill();
}
let flashAt=-9;
function drawStorm(t){
  ctx.fillStyle='rgba(25,35,55,.2)';ctx.fillRect(0,0,FIELD_W,FIELD_H);
  drawRain(t,2);
  const u=t-flashAt;
  if(u<.35&&!reducedMotion){ctx.fillStyle=`rgba(240,245,255,${.65*(1-u/.35)*(u<.08||u>.14?1:.3)})`;ctx.fillRect(0,0,FIELD_W,FIELD_H);} // a double flash
}
function drawWeather(t){
  const w=level.weather;
  if(w==='night')drawNight(t);
  else if(w==='fog')drawFog(t);
  else if(w==='snow')drawSnowfall(t);
  else if(w==='storm')drawStorm(t);
}
const howl=()=>{tone(320,{length:.5,volume:.09,type:'sine',endFreq:620});tone(620,{delay:.45,length:1.3,volume:.09,type:'sine',endFreq:470});tone(930,{delay:.45,length:1.2,volume:.025,type:'sine',endFreq:700});};
const yelp=()=>{tone(900,{length:.12,volume:.07,type:'triangle',endFreq:1400});tone(1300,{delay:.14,length:.1,volume:.05,type:'triangle',endFreq:1700});};
const rumble=()=>{tone(55,{length:1.6,volume:.35,type:'sine',endFreq:38});tone(82,{delay:.05,length:1.1,volume:.2,type:'triangle',endFreq:50});tone(140,{length:.25,volume:.12,type:'sawtooth',endFreq:60});};

/* ---------- main loop ---------- */
let lastFrame=performance.now(),shown={}; // shown: last text written to each HUD element, to skip needless DOM writes
function showText(id,text){if(shown[id]===text)return false;shown[id]=text;$('#'+id).textContent=text;return true;}
function handleEvent(ev,t){
  if(ev.type==='pen'){popups.push({x:ev.x,y:ev.y,t0:t,text:'+1',colour:'#efbd4c'});penChime(t);sayIf(ev.sheep,LINES.happy,.3,t);}
  else if(ev.type==='wrong'){popups.push({x:ev.x,y:ev.y,t0:t,text:'✗',colour:'#ef7b6b'});wrongBuzz();sayIf(ev.sheep,LINES.wrong,.9,t);}
  else if(ev.type==='shut'){gateShut.set(ev.pen,t);gateThud(GATE_SWING*.85);sayIf(world.sheep.find(s=>s.penned===ev.pen),['hooray!','all in!','we did it','home!'],1,t);}
  else if(ev.type==='howl'){ // the sheep nearest the wolf raises the alarm
    howl();
    const w=world.wolf;
    if(w)sayIf(world.sheep.filter(s=>!s.penned).sort((a,b)=>Math.hypot(a.x-w.x,a.y-w.y)-Math.hypot(b.x-w.x,b.y-w.y))[0],['WOLF!!','I knew it','told you'],1,t);
  }
  else if(ev.type==='wolfFlee'){yelp();}
  else if(ev.type==='course'){fanfareShort();const o=world.course[ev.index];popups.push({x:(o.a[0]+o.b[0])/2,y:(o.a[1]+o.b[1])/2-20,t0:t,text:'Gate '+(ev.index+1)+' ✓',colour:'#9bd47a'});}
  else if(ev.type==='unlock'){for(const P of world.pens)popups.push({x:P.x+P.w/2,y:P.y+P.h/2,t0:t,text:'Pen open!',colour:'#efbd4c'});gateThud(0);}
  else if(ev.type==='thunder'){flashAt=t;rumble();sayIf(world.sheep.find(s=>!s.penned&&inView(s.x,s.y,viewRect(0))),['EEK','mum!!','not the sky!'],1,t);}
  else if(ev.type==='bleat'){bleat(ev.kind,inView(ev.sheep.x,ev.sheep.y,viewRect(0))?.7:.25);sayIf(ev.sheep,LINES.scared,.15,t);} // far off: quieter
}
const SLOWMO=.35,CLOSING=1.1; // after the last sheep: sim speed, and real seconds before the results
function frame(now){
  const dt=Math.min(.05,(now-lastFrame)/1000),t=now/1000;lastFrame=now;
  if(mode==='play'||mode==='closing'){
    steerDogs();
    timeBank+=dt*(mode==='closing'?SLOWMO:1);
    while(timeBank>=DT&&(mode==='play'||mode==='closing')){
      step(world,DT);timeBank-=DT;
      for(const ev of world.events)handleEvent(ev,t);
      world.events.length=0;
      if(mode!=='play')continue;
      recordRun();
      if(world.penned===world.sheep.length){mode='closing';endTime=world.t;closingUntil=t+CLOSING;pointerHeld=false;celebrate(t);}
      else if(world.t>=timeLimit())finish(false);
    }
    kickDust(t);
    if(mode==='closing'&&t>=closingUntil)finish(true);
  }
  if(mode==='ready'||mode==='play'){idleBleat(t);ambience(t);}
  if(mode!=='paused'){followCamera(dt);animate(dt,t);updateLife(dt,t);chatter(t);}
  render(now);
  const cooldown=Math.ceil(world.dogs[selected].barkCooldown);
  if(shown.cooldown!==cooldown){shown.cooldown=cooldown;$('#barkCd').textContent=cooldown>0?cooldown+'s':'';$('#bBark').disabled=cooldown>0;}
  showText('sTime',(clockRunning()?world.t:endTime).toFixed(1)+'s');
  if(showText('sSheep',`${world.penned}/${world.sheep.length}`)&&world.penned){const el=$('#sSheep');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  $('#sTime').style.color=timeLimit()-world.t<10&&mode==='play'?'var(--bad)':'';
  requestAnimationFrame(frame);
}
showSound();
load(ORDER[0]);requestAnimationFrame(frame);
</script>
