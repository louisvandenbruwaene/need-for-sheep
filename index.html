<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Herd the flock into the pen with your sheepdogs. Free browser game.">
<title>Need for Sheep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one pasture board, level strip above, route tools and live numbers below. Single dusk-pasture look on purpose. */
:root{
  --bg:#1e251c; --panel:#2b3428; --panel2:#354031; --ink:#f0f1e6; --muted:#a8b29c; --line:#46523f;
  --accent:#efbd4c; --good:#9bd47a; --bad:#ef7b6b;
  --f-display:"Fredoka", "Avenir Next Rounded", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em}
#lvname{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--muted)}
.levels{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.farmnav{display:flex;align-items:center;gap:6px}
.farmnav button{width:34px;padding:8px 0}
.farmname{display:grid;line-height:1.15;min-width:150px;text-align:center}
.farmname span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.farmname b{font-family:var(--f-display);font-weight:600;font-size:16px}
.farmname small{font-size:11px;color:var(--accent)}
.farmlevels{display:flex;gap:6px;flex-wrap:wrap}
#starTotal{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--accent)}
.lv{width:44px;padding:5px 0 4px;display:grid;justify-items:center;gap:0;line-height:1.1}
.lv b{font-size:16px}.lv small{font-size:10px;letter-spacing:1px;color:var(--accent)}
.lv.cur{background:var(--accent);color:#2a2410}.lv.cur small{color:#2a2410}
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#86a663}
canvas{display:block;width:100%;aspect-ratio:8/5;max-width:100%;touch-action:none;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font-family:var(--f-display);font-size:16px;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--panel2);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #151a13;transition:transform .06s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #151a13}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#2a2410;min-width:96px}
button.off{opacity:.45}
button.whistle{width:44px;padding:9px 0;touch-action:none}
button.whistle.on{background:var(--accent);color:#2a2410}
.dog{display:flex;align-items:center;gap:7px}
.dog i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:0 0 0 2px #151a13}
.dog.sel{box-shadow:0 0 0 3px var(--c) inset,0 3px 0 #151a13}
.stats{display:flex;gap:20px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.stat{display:grid;line-height:1.1}
.stat b{font-size:22px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.overlay{position:absolute;inset:0;display:grid;place-items:safe center;overflow:auto;background:rgba(18,23,16,.6);padding:16px}
.res{background:var(--panel);border:2px solid var(--line);padding:18px 26px;border-radius:16px;text-align:center;display:grid;gap:10px;min-width:min(320px,100%)}
.res h2{font-family:var(--f-display);font-size:28px;margin:0}
.stars{display:flex;justify-content:center;gap:8px}
.stars span{font-size:44px;line-height:1;color:var(--line)}
.stars span.on{color:var(--accent);animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.best{font-family:var(--f-display);color:var(--accent);min-height:1.2em}
.fun{font-size:13px;color:var(--muted);max-width:300px;justify-self:center}
#sSheep.bump{animation:bump .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1.5);color:var(--accent)}100%{transform:scale(1)}}
.stat b{display:inline-block;transform-origin:left center}
.goals{display:grid;gap:4px;text-align:left;font-variant-numeric:tabular-nums}
.goals div{display:flex;gap:8px}.goals .ok{color:var(--good)}.goals .no{color:var(--muted)}
.res .group{justify-content:center}
.res .board-open{justify-self:center;font-size:13px;padding:5px 12px}
.board{display:grid;gap:8px;width:min(300px,100%);justify-self:center}
.board form{display:flex;gap:6px}
.board input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.board input:focus{outline:none;border-color:var(--accent)}
.board ol{margin:0;padding:0;list-style:none;display:grid;gap:2px;text-align:left;font-variant-numeric:tabular-nums}
.board li{display:flex;gap:8px;padding:2px 6px;border-radius:6px}
.board li span:first-child{width:28px;color:var(--muted)}
.board li span:last-child{margin-left:auto}
.board li{cursor:pointer}.board li:hover{background:var(--panel2)}
.board li.me{background:var(--panel2);color:var(--accent)}
.board .note{margin:0;font-size:13px;color:var(--muted)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stars span.on{animation:none}}
@media (max-width:560px){h1{font-size:24px}.stat b{font-size:18px}button{font-size:14px;padding:8px 11px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title"><h1>Need for Sheep</h1><span id="lvname"></span><span id="starTotal"></span></div>
    <div class="levels" id="levels"></div>
  </div>
  <div class="stage">
    <canvas id="field" width="800" height="500" aria-label="Pasture. Hold and drag to run the dog."></canvas>
    <div class="overlay" id="ov" hidden>
      <div class="res">
        <h2 id="ovTitle"></h2>
        <div class="stars" id="ovStars"></div>
        <div class="best" id="ovBest"></div>
        <div class="fun" id="ovFun"></div>
        <div class="goals" id="ovGoals"></div>
        <button class="board-open" id="boardOpen">Leaderboard</button>
        <div class="board" id="board" hidden>
          <form id="boardForm"><input id="boardName" maxlength="16" placeholder="Your name" autocomplete="nickname" aria-label="Your name"><button class="primary" id="boardSend">Send</button></form>
          <ol id="boardList"></ol>
          <p class="note" id="boardNote"></p>
          <p class="note">Tap a time to race its ghost.</p>
        </div>
        <div class="group"><button id="ovRetry">Retry</button><button class="primary" id="ovNext">Next</button></div>
      </div>
    </div>
  </div>
  <div class="bar">
    <div class="group" id="dogs"></div>
    <div class="stats">
      <div class="stat"><b id="sTime">0.0s</b><span>time</span></div>
      <div class="stat"><b id="sSheep">0/1</b><span id="sSheepLabel">penned</span></div>
    </div>
    <div class="group">
      <button id="bGhost" title="G: show or hide the ghost">Ghost</button>
      <button id="bSound" title="M: sound on or off" aria-label="Sound">🔊</button>
      <button class="whistle" id="bComeBye" title="Q (hold): come bye, circle the flock clockwise" aria-label="Come bye">↻</button>
      <button class="whistle" id="bAway" title="E (hold): away to me, circle the flock anticlockwise" aria-label="Away to me">↺</button>
      <button id="bBark" title="Space">Bark <small id="barkCd"></small></button>
      <button class="primary" id="bRestart">Restart</button>
    </div>
  </div>
</div>

<script id="sim">
/* ---------- simulation (pure, no DOM) ---------- */

// Field and clock
const FIELD_W=800,FIELD_H=500;  // the screen, and the default field; a level's field:[w,h] may be larger, then the view follows the dog
const DT=1/120;               // fixed simulation step, seconds
const LIMIT=90;               // default time limit per level, seconds

// Dogs
const DOG_MAX=160,DOG_WALK=95; // sprint and walk speed
const DOG_RADIUS=12;
const DOG_EDGE=6;             // dogs may run right up to the field edge, so they can drive sheep inward
const SPRINT_FROM=105;        // a dog counts as sprinting above this speed, fully at DOG_MAX
// A dog scares sheep within RMIN while it walks; the range grows to 2*RMIN while it sprints.
const RMIN=70;
const BARK_RADIUS=170,BARK_COOLDOWN=4;

// Sheep
const EWE=0,LAMB=1;
const SHEEP_EDGE=14;          // sheep keep this far off the field edge
const LAMB_BOOST=1.15;        // lambs are skittish: they notice dogs from further away and run faster
const GATE_WIDTH=110;          // a pen may set its own gateWidth
const REJOIN=320;              // a sheep with no flockmate in sight walks back to the nearest one this close
const HIDE_SEEK=200,HIDE_SPEED=100; // after a bark, lambs look for ewes this close and trot (not sprint) behind them

/* ---------- small helpers ---------- */
const clamp=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
const inRect=(rects,p)=>rects.some(([x,y,w,h])=>p.x>x&&p.x<x+w&&p.y>y&&p.y<y+h);
const inBush=(world,p)=>world.bushes.some(([x,y,r])=>Math.hypot(p.x-x,p.y-y)<r);
const isSheep=body=>body.kind!==undefined;
const fitsPen=(P,s)=>P.kind===undefined||P.kind===s.kind;
const insidePen=(P,s,margin=9)=>s.x>P.x+margin&&s.x<P.x+P.w-margin&&s.y>P.y+margin&&s.y<P.y+P.h-margin;
const bodyRadius=body=>body.kind?6:8;

// Remove any part of the vector (x,y) that points against the unit direction (ux,uy).
// Used so that flocking and the pull to mid-field never walk a sheep toward a dog.
function dropBackward(x,y,ux,uy){
  const back=x*ux+y*uy;
  if(back<0){x-=back*ux;y-=back*uy;}
  return [x,y];
}

// Deterministic random numbers (mulberry32), so levels and replays are the same every time.
function rng(seed){
  return()=>{
    seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

/* ---------- level data ---------- */
// A sheep is [x,y] for a ewe or [x,y,1] for a lamb.
const lambs=list=>list.map(([x,y])=>[x,y,LAMB]);
// count sheep scattered in a disc of radius `spread` around (cx,cy)
function cluster(cx,cy,count,spread,seed){
  const random=rng(seed),out=[];
  for(let i=0;i<count;i++){
    const angle=random()*6.283,dist=Math.sqrt(random())*spread;
    out.push([cx+Math.cos(angle)*dist,cy+Math.sin(angle)*dist]);
  }
  return out;
}

// fences [x1,y1,x2,y2], rocks [x,y,r], water / mud / bridges [x,y,w,h], bushes [x,y,r],
// par {time,gold} for the stars, limit (seconds) and a tip shown before the start.
// A pen with a kind (EWE or LAMB) is a sorting pen: it takes any sheep but only counts its own kind.
// Every pen sits flush against the field edge, a fence or another pen, or has at least 110 px of open

/* ---------- building a world ---------- */
function penSide(pen,side){
  const {x,y,w,h}=pen;
  return {top:[[x,y],[x+w,y]],bottom:[[x,y+h],[x+w,y+h]],left:[[x,y],[x,y+h]],right:[[x+w,y],[x+w,y+h]]}[side];
}
// the open part of the gate side, as a segment [x1,y1,x2,y2]
function gateOpening(pen){
  const [a,b]=penSide(pen,pen.gate),len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  const width=pen.gateWidth||GATE_WIDTH,ux=(b[0]-a[0])/len,uy=(b[1]-a[1])/len,start=(len-width)/2;
  return [a[0]+ux*start,a[1]+uy*start,a[0]+ux*(start+width),a[1]+uy*(start+width)];
}
// four walls, with the gate side split around the opening
function penWalls(pen){
  const walls=[];
  for(const side of ['top','bottom','left','right']){
    const [a,b]=penSide(pen,side);
    if(side!==pen.gate){walls.push([a[0],a[1],b[0],b[1]]);continue;}
    const [ox1,oy1,ox2,oy2]=gateOpening(pen);
    walls.push([a[0],a[1],ox1,oy1]);
    walls.push([ox2,oy2,b[0],b[1]]);
  }
  return walls;
}

// A right-angled pocket, where a pen, a fence or water meets the field edge or two field edges meet, traps a
// sheep pushed into it. Each gets a short diagonal panel across it: stone in the field's corners, fence
// elsewhere, and never across a gate. Returns [{wall:[x1,y1,x2,y2],stone}].
const CHAMFER=80;
function chamfers(pens,fences,water,W,H){
  const out=[],add=(x1,y1,x2,y2,stone)=>out.push({wall:[x1,y1,x2,y2],stone});
  const covers=(x,y)=>pens.some(P=>x>=P.x-CHAMFER&&x<=P.x+P.w+CHAMFER&&y>=P.y-CHAMFER&&y<=P.y+P.h+CHAMFER)
    ||water.some(([wx,wy,ww,wh])=>x>=wx-CHAMFER&&x<=wx+ww+CHAMFER&&y>=wy-CHAMFER&&y<=wy+wh+CHAMFER);
  for(const [cx,cy,dx,dy] of [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]])
    if(!covers(cx,cy))add(cx+dx*CHAMFER,cy,cx,cy+dy*CHAMFER,true);
  // blocks against an edge: pens (their wall stops short of the gate) and water
  const blocks=[...pens.map(P=>({...P,gw:P.gateWidth||GATE_WIDTH})),...water.map(([x,y,w,h])=>({x,y,w,h}))];
  for(const B of blocks){
    const wall=side=>{const len=side==='left'||side==='right'?B.h:B.w;return B.gate===side?(len-B.gw)/2-10:len;}; // solid wall from the corner
    const c=side=>Math.min(CHAMFER,wall(side));
    const pocket=(side,x1,y1,x2,y2)=>{if(c(side)>=30)add(x1,y1,x2,y2,false);};
    const L=B.x,R=B.x+B.w,T=B.y,Bo=B.y+B.h;
    if(Bo>=H-.5){if(L>.5)pocket('left',L,H-c('left'),L-c('left'),H);if(R<W-.5)pocket('right',R,H-c('right'),R+c('right'),H);}
    if(T<=.5){if(L>.5)pocket('left',L,c('left'),L-c('left'),0);if(R<W-.5)pocket('right',R,c('right'),R+c('right'),0);}
    if(L<=.5){if(T>.5)pocket('top',c('top'),T,0,T-c('top'));if(Bo<H-.5)pocket('bottom',c('bottom'),Bo,0,Bo+c('bottom'));}
    if(R>=W-.5){if(T>.5)pocket('top',W-c('top'),T,W,T-c('top'));if(Bo<H-.5)pocket('bottom',W-c('bottom'),Bo,W,Bo+c('bottom'));}
  }
  // fences running square into the edge: a panel on each side of where they meet it
  for(const [x1,y1,x2,y2] of fences)for(const [x,y,ox,oy] of [[x1,y1,x2,y2],[x2,y2,x1,y1]]){
    const len=Math.hypot(ox-x,oy-y),c=Math.min(CHAMFER*.75,len-10);
    if(c<30)continue;
    if((y<=.5||y>=H-.5)&&Math.abs(ox-x)<1){const dy=y<=.5?1:-1;add(x,y+dy*c,x-c,y);add(x,y+dy*c,x+c,y);}
    else if((x<=.5||x>=W-.5)&&Math.abs(oy-y)<1){const dx=x<=.5?1:-1;add(x+dx*c,y,x,y-c);add(x+dx*c,y,x,y+c);}
  }
  return out;
}

// Trial levels: level.course = [{a:[x,y],b:[x,y]}, ...], pairs of hurdles; the flock goes between a and b.
// A pair is done once COURSE_SHARE of the flock has crossed between them, and the pens stay locked
// until every pair is done. Each hurdle stands across the line a-b, HURDLE long.
const COURSE_SHARE=.75,HURDLE=56;
function courseHurdles(course){
  return course.flatMap(({a,b})=>{
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]),nx=-(b[1]-a[1])/len,ny=(b[0]-a[0])/len,h=HURDLE/2;
    return [a,b].map(([x,y])=>[x-nx*h,y-ny*h,x+nx*h,y+ny*h]);
  });
}
function makeCourse(level,sheep){
  return (level.course||[]).map(({a,b})=>({a,b,done:false,crossed:new Set(),side:sheep.map(s=>Math.sign((b[0]-a[0])*(s.y-a[1])-(b[1]-a[1])*(s.x-a[0])))}));
}
function checkCourse(world){
  if(!world.course.length||world.course.every(o=>o.done))return;
  world.sheep.forEach((s,i)=>{
    for(const o of world.course){
      if(o.done)continue;
      const [ax,ay]=o.a,[bx,by]=o.b,side=Math.sign((bx-ax)*(s.y-ay)-(by-ay)*(s.x-ax));
      if(side&&side!==o.side[i]&&o.side[i]){ // crossed the line: between the hurdles?
        const u=((s.x-ax)*(bx-ax)+(s.y-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2);
        if(u>=0&&u<=1)o.crossed.add(s);
      }
      if(side)o.side[i]=side;
    }
  });
  world.course.forEach((o,k)=>{
    if(o.done||o.crossed.size<Math.ceil(world.sheep.length*COURSE_SHARE))return;
    o.done=true;world.events.push({type:'course',index:k});
  });
  if(world.course.every(o=>o.done)){ // unlock the pens
    world.walls=world.walls.filter(w=>!world.locks.includes(w));
    for(const P of world.pens)P.locked=false;
    world.events.push({type:'unlock'});
  }
}

function makeWorld(level){
  const random=rng(99);
  const dogs=level.dogs.map(([x,y])=>({
    x,y,vx:0,vy:0,heading:0,
    driving:false,targetX:x,targetY:y,maxSpeed:DOG_MAX,gain:6, // set each frame by the controls
    moving:false,sprint:0,range:RMIN,barkCooldown:0,
  }));
  const sheep=level.sheep.map(([x,y,kind])=>({
    x,y,vx:0,vy:0,kind:kind||EWE,penned:false,wrongPen:null, // wrongPen: the pen of the other kind it stands in
    heading:random()*6.283,wanderAngle:random()*6.283,
    fear:0,      // 0..1, how scared it is right now (also spreads to flockmates)
    panic:0,     // 0..1, raised by sprinting dogs; loosens the flock
    huddleTime:0,hideTime:0,hideFrom:null, // set by a bark
    hopTime:0,slideDir:0,
  }));
  const pens=(level.pens||[level.pen]).map(P=>{
    const cx=P.x+P.w/2,cy=P.y+P.h/2,out=40;
    // a point just inside the gate (sheep nearby are drawn in) and one just outside (the centre pull fades near it)
    const [insideX,insideY,outsideX,outsideY]={
      left:[P.x+30,cy,P.x-out,cy],
      top:[cx,P.y+30,cx,P.y-out],
      bottom:[cx,P.y+P.h-30,cx,P.y+P.h+out],
      right:[P.x+P.w-30,cy,P.x+P.w+out,cy],
    }[P.gate];
    // the back of the pen, opposite the gate: penned sheep drift there and leave the gateway free
    const [backX,backY]={left:[P.x+P.w-25,cy],top:[cx,P.y+P.h-25],bottom:[cx,P.y+25],right:[P.x+25,cy]}[P.gate];
    // the gate's middle and its outward direction: only sheep in front of the gate feel its pull
    const [gateX,gateY,outX,outY]={left:[P.x,cy,-1,0],top:[cx,P.y,0,-1],bottom:[cx,P.y+P.h,0,1],right:[P.x+P.w,cy,1,0]}[P.gate];
    return {...P,insideX,insideY,outsideX,outsideY,backX,backY,gateX,gateY,outX,outY,shut:false};
  });
  // terrain: water (sheep cannot enter, dogs swim slowly), mud (everyone slow), bushes (scared sheep hide in them)
  const water=level.water||[];
  const waterEdges=water.flatMap(([x,y,w,h])=>[[x,y,x+w,y],[x+w,y,x+w,y+h],[x,y+h,x+w,y+h],[x,y,x,y+h]]);
  const [W,H]=level.field||[FIELD_W,FIELD_H];
  const panels=chamfers(pens,level.fences||[],water,W,H);
  const course=makeCourse(level,sheep),hurdles=courseHurdles(level.course||[]);
  const locks=course.length?pens.map(P=>{P.locked=true;return gateOpening(P);}):[];
  return {
    level,t:0,penned:0,events:[],random:rng(7),W,H,open:W>FIELD_W||H>FIELD_H,
    dogs,sheep,pens,panels,
    walls:[...pens.flatMap(penWalls),...(level.fences||[]),...panels.map(p=>p.wall),...hurdles,...locks],
    course,hurdles,locks,
    rocks:level.rocks||[],water,waterEdges,mud:level.mud||[],bushes:level.bush||[],
  };
}

/* ---------- bark ---------- */
// Ewes in range huddle and stand their ground; lambs in range run round behind the ewes (see hideSpot).
function bark(world,dogIndex){
  const dog=world.dogs[dogIndex];
  if(!dog||dog.barkCooldown>0)return false;
  dog.barkCooldown=BARK_COOLDOWN;
  if(world.wolf&&Math.hypot(world.wolf.x-dog.x,world.wolf.y-dog.y)<BARK_RADIUS*1.5)scareWolf(world);
  for(const s of world.sheep){
    if(s.penned||Math.hypot(s.x-dog.x,s.y-dog.y)>BARK_RADIUS)continue;
    if(s.kind!==LAMB){s.huddleTime=1.4;s.fear=Math.max(s.fear,.5);continue;}
    s.hideTime=3;s.hideFrom=dog;s.fear=1;
  }
  return true;
}

/* ---------- collisions ---------- */
// Push a dog or sheep out of anything solid: the field edge, water (sheep only), rocks, walls and closed gates.
function collide(world,body,edge=SHEEP_EDGE){
  const r=bodyRadius(body);
  body.x=clamp(body.x,edge,world.W-edge);
  body.y=clamp(body.y,edge,world.H-edge);
  if(isSheep(body))for(const [x,y,w,h] of world.water){ // sheep do not swim: push out of the water the short way
    if(body.x>x-r&&body.x<x+w+r&&body.y>y-r&&body.y<y+h+r){
      const exits=[[body.x-(x-r),-1,0],[(x+w+r)-body.x,1,0],[body.y-(y-r),0,-1],[(y+h+r)-body.y,0,1]];
      const [depth,nx,ny]=exits.sort((a,b)=>a[0]-b[0])[0];
      body.x+=nx*depth;body.y+=ny*depth;
      if(nx&&body.vx*nx<0)body.vx=0;
      if(ny&&body.vy*ny<0)body.vy=0;
    }
  }
  for(const [cx,cy,cr] of world.rocks){
    const dx=body.x-cx,dy=body.y-cy,d=Math.hypot(dx,dy)||1;
    if(d<cr+r){
      body.x=cx+dx/d*(cr+r);body.y=cy+dy/d*(cr+r);
      const vn=(body.vx*dx+body.vy*dy)/d;
      if(vn<0){body.vx-=vn*dx/d;body.vy-=vn*dy/d;}
    }
  }
  for(const [x1,y1,x2,y2] of world.walls){
    if(body.x<Math.min(x1,x2)-r-1||body.x>Math.max(x1,x2)+r+1||body.y<Math.min(y1,y2)-r-1||body.y>Math.max(y1,y2)+r+1)continue;
    const ex=x2-x1,ey=y2-y1,u=clamp(((body.x-x1)*ex+(body.y-y1)*ey)/(ex*ex+ey*ey),0,1);
    const qx=x1+ex*u,qy=y1+ey*u,dx=body.x-qx,dy=body.y-qy,d=Math.hypot(dx,dy)||1e-3;
    if(d<r+1){
      const nx=dx/d,ny=dy/d;
      body.x=qx+nx*(r+1);body.y=qy+ny*(r+1);
      const vn=body.vx*nx+body.vy*ny;
      if(vn<0){body.vx-=vn*nx;body.vy-=vn*ny;}
    }
  }
}

/* ---------- dogs ---------- */
function moveDog(world,dog,dt){
  const terrain=inRect(world.water,dog)?.45:inRect(world.mud,dog)?.55:inBush(world,dog)?.65:1;
  if(dog.driving){ // ease toward the target, slowing down as it gets close
    const dx=dog.targetX-dog.x,dy=dog.targetY-dog.y,dist=Math.hypot(dx,dy)||1;
    const speed=Math.min(dog.maxSpeed,dist*dog.gain)*terrain,k=Math.min(1,dt*10);
    dog.vx+=(dx/dist*speed-dog.vx)*k;
    dog.vy+=(dy/dist*speed-dog.vy)*k;
  }else{
    const k=Math.exp(-10*dt);dog.vx*=k;dog.vy*=k;
  }
  dog.x+=dog.vx*dt;dog.y+=dog.vy*dt;
  collide(world,dog,DOG_EDGE);
  const speed=Math.hypot(dog.vx,dog.vy);
  if(speed>5)dog.heading=Math.atan2(dog.vy,dog.vx);
  dog.moving=speed>25;
  const sprintNow=clamp((speed-SPRINT_FROM)/(DOG_MAX-SPRINT_FROM),0,1);
  dog.sprint+=(sprintNow-dog.sprint)*Math.min(1,dt*(sprintNow>dog.sprint?3:1.1)); // quick to alarm, slow to settle
  dog.range=RMIN*(1+dog.sprint);
  dog.barkCooldown=Math.max(0,dog.barkCooldown-dt);
}

/* ---------- sheep ---------- */
// Sheep steer toward a desired velocity built in priority order:
//   1. get away from the dogs (ssenseDogs)
//   2. stay with the flock, but never by moving toward a dog (flockVelocity)
//   3. an always-on slow drift away from the dogs, and a slight pull toward mid-field (centrePull)
// On top of that come a few direct pushes: personal space, bushes, pen gates, grazing, walls.

// How the dogs (and a wolf) make this sheep feel. Adds the "too close, shove away" push straight into acc.
function senseDogs(world,s,acc){
  const boost=s.kind===LAMB?LAMB_BOOST:1,hidden=inBush(world,s);
  let fleeX=0,fleeY=0,awayX=0,awayY=0,fear=0,panic=0;
  for(const dog of world.threats){ // the dogs, and a wolf while it is about
    const ex=s.x-dog.x,ey=s.y-dog.y,dist=Math.hypot(ex,ey)||1,range=dog.range*boost;
    awayX+=ex/(dist*dist);awayY+=ey/(dist*dist); // which way is "away from the dogs", nearer dogs count more
    if(dist<45){const q=1-dist/45;acc.x+=ex/dist*2600*q*q;acc.y+=ey/dist*2600*q*q;}
    if(dist>=range)continue;
    const close=1-dist/range; // 0 at the edge of the range, 1 at the dog
    // flee speed: edge+walking ~20, close+walking ~90, edge+running ~90, close+running ~190
    let speed=(15+85*close*Math.sqrt(close)+dog.sprint*(65+40*close))*boost;
    if(s.huddleTime)speed*=.2;
    if(hidden&&dist>50)speed*=.3;
    if(s.hideTime)speed*=.3;
    fleeX+=ex/dist*speed;fleeY+=ey/dist*speed;
    fear=Math.max(fear,Math.min(1,speed/(160*boost)));
    panic=Math.max(panic,dog.sprint*(.4+.6*close));
  }
  const len=Math.hypot(awayX,awayY);
  return {fleeX,fleeY,awayX:len?awayX/len:0,awayY:len?awayY/len:0,fear,panic};
}

// A grid of the sheep, rebuilt every step, so a sheep only looks at the nine cells around it.
// A cell is wider than any sheep's sight, plus what a sheep can move in one step.
const CELL=96;
function buildGrid(world){
  const cols=Math.ceil(world.W/CELL),rows=Math.ceil(world.H/CELL);
  const cells=Array.from({length:cols*rows},()=>[]);
  for(const s of world.sheep)cells[clamp(s.y/CELL|0,0,rows-1)*cols+clamp(s.x/CELL|0,0,cols-1)].push(s);
  world.grid={cols,rows,cells};
}
// the sheep in the nine cells around s, gathered into one reused list
const nearby=[];
function nearbySheep(world,s){
  const {cols,rows,cells}=world.grid,ci=clamp(s.x/CELL|0,0,cols-1),cj=clamp(s.y/CELL|0,0,rows-1);
  nearby.length=0;
  for(let j=Math.max(0,cj-1);j<=Math.min(rows-1,cj+1);j++)
    for(let i=Math.max(0,ci-1);i<=Math.min(cols-1,ci+1);i++){const cell=cells[j*cols+i];for(let k=0;k<cell.length;k++)nearby.push(cell[k]);}
  return nearby;
}

// Neighbours within sight: their centre, mean velocity and highest fear. Adds personal-space pushes into acc.
function senseFlock(world,s,acc){
  const isLamb=s.kind===LAMB,sight=isLamb?60:90;
  let count=0,cx=0,cy=0,vx=0,vy=0,maxFear=0;
  for(const o of nearbySheep(world,s)){
    if(o===s||o.penned!==s.penned)continue;
    const ex=s.x-o.x,ey=s.y-o.y;
    if(ex>sight||ex<-sight||ey>sight||ey<-sight)continue; // out of sight: skip the square root (big flocks)
    const dist=Math.sqrt(ex*ex+ey*ey)||1;
    if(dist>=sight)continue;
    const space=s.kind&&o.kind?13:18;
    if(dist<space){acc.x+=ex/dist*500*(1-dist/space);acc.y+=ey/dist*500*(1-dist/space);}
    const mate=s.huddleTime||s.hideTime?o.kind===s.kind:true; // after a bark ewes bunch with ewes and lambs stick with lambs
    if(mate&&dist<sight){count++;cx+=o.x;cy+=o.y;vx+=o.vx;vy+=o.vy;maxFear=Math.max(maxFear,o.fear);}
  }
  return count?{count,cx:cx/count,cy:cy/count,vx:vx/count,vy:vy/count,maxFear}:{count,maxFear};
}

// A slight pull toward mid-field, stronger the nearer a corner. Fades out by the sheep's own pen gate
// so it never fights a drive into a pen against the edge.
function centrePull(world,s){
  const mx=(world.W/2-s.x)/(world.W/2),my=(world.H/2-s.y)/(world.H/2),off2=mx*mx+my*my,off=Math.sqrt(off2)||1;
  let nearGate=1;
  for(const P of world.pens)
    nearGate=Math.min(nearGate,Math.max(0,Math.hypot(P.outsideX-s.x,P.outsideY-s.y)-60)/140);
  return [mx/off*3*off2*nearGate,my/off*3*off2*nearGate];
}

// Regroup with the flock and match its heading.
function flockVelocity(s,flock,dogs){
  const loose=1-.6*s.panic; // a running dog loosens the flock
  const gx=flock.cx-s.x,gy=flock.cy-s.y,gap=Math.hypot(gx,gy)||1;
  const speed=Math.min(gap*2.2,s.huddleTime?60:(22+80*s.fear)*(s.kind===LAMB?.6:1))*loose;
  const [hx,hy]=dropBackward(gx/gap*speed,gy/gap*speed,dogs.awayX,dogs.awayY);
  const align=.5*s.fear*loose;
  return [hx+flock.vx*align,hy+flock.vy*align];
}

// On an open field (bigger than the screen) a sheep that has lost the flock (nobody within LOST) walks back
// to the nearest flockmate, never toward a dog. In a paddock the flock is always in sight.
const LOST=150;
function rejoinVelocity(world,s,dogs){
  let mate=null,dist=REJOIN;
  for(const o of world.sheep){
    if(o===s||o.penned)continue;
    const d=Math.hypot(o.x-s.x,o.y-s.y);
    if(d<LOST)return [0,0];
    if(d<dist){dist=d;mate=o;}
  }
  if(!mate)return [0,0];
  const speed=(s.kind===LAMB?40:28)*(1-.6*s.panic);
  return dropBackward((mate.x-s.x)/dist*speed,(mate.y-s.y)/dist*speed,dogs.awayX,dogs.awayY);
}

// After a bark a lamb trots to a spot just beyond the nearby ewes, on the far side from the barking dog.
// If it starts on the dog's side it first goes round the flank of the ewes instead of through the dog.
function hideSpot(world,s){
  const dog=s.hideFrom;
  let ex=0,ey=0,n=0;
  for(const o of world.sheep)if(!o.penned&&o.kind!==LAMB&&Math.hypot(o.x-s.x,o.y-s.y)<HIDE_SEEK){ex+=o.x;ey+=o.y;n++;}
  if(!n)return null; // no ewes nearby to hide behind
  ex/=n;ey/=n;
  let ux=ex-dog.x,uy=ey-dog.y;const len=Math.hypot(ux,uy)||1;ux/=len;uy/=len; // from the dog through the ewes
  let flockRadius=0;
  for(const o of world.sheep)if(!o.penned&&o.kind!==LAMB&&Math.hypot(o.x-ex,o.y-ey)<120)
    flockRadius=Math.max(flockRadius,Math.hypot(o.x-ex,o.y-ey));
  let x=ex+ux*(flockRadius+30),y=ey+uy*(flockRadius+30);
  const along=(s.x-ex)*ux+(s.y-ey)*uy,side=(s.x-ex)*-uy+(s.y-ey)*ux;
  if(along<flockRadius*.5){ // still on the dog's side: go round the flock's flank
    const sign=side<0?-1:1,ahead=Math.max(0,along+20);
    x=ex-uy*sign*(flockRadius+28)+ux*ahead;
    y=ey+ux*sign*(flockRadius+28)+uy*ahead;
  }
  return [clamp(x,24,world.W-24),clamp(y,24,world.H-24)];
}

// Keep a little off walls, and turn a push into a wall into a slide along it, so nothing jams in a corner.
function steerOffWalls(world,s,acc){
  let nx=0,ny=0;
  const repel=(dx,dy,dist,margin)=>{if(dist<margin){const k=1-Math.max(0,dist)/margin;nx+=dx*k;ny+=dy*k;}};
  repel(1,0,s.x,38);repel(-1,0,world.W-s.x,38);repel(0,1,s.y,38);repel(0,-1,world.H-s.y,38);
  for(const [x1,y1,x2,y2] of world.walls.concat(world.waterEdges)){
    if(s.x<Math.min(x1,x2)-34||s.x>Math.max(x1,x2)+34||s.y<Math.min(y1,y2)-34||s.y>Math.max(y1,y2)+34)continue; // beyond the 26 margin
    const ex=x2-x1,ey=y2-y1,u=clamp(((s.x-x1)*ex+(s.y-y1)*ey)/(ex*ex+ey*ey),0,1);
    const dx=s.x-x1-ex*u,dy=s.y-y1-ey*u,d=Math.hypot(dx,dy)||1;
    repel(dx/d,dy/d,d-8,26);
  }
  for(const [rx,ry,rr] of world.rocks){const dx=s.x-rx,dy=s.y-ry,d=Math.hypot(dx,dy)||1;repel(dx/d,dy/d,d-rr-8,26);}
  const strength=Math.hypot(nx,ny);
  if(strength<=.05){s.slideDir=0;return;}
  const ux=nx/strength,uy=ny/strength,tx=-uy,ty=ux,into=acc.x*ux+acc.y*uy;
  acc.x+=ux*Math.min(strength,1.5)*70;acc.y+=uy*Math.min(strength,1.5)*70;
  if(into<0){
    const across=acc.x*tx+acc.y*ty;
    if(Math.abs(across)>-into*.3)s.slideDir=Math.sign(across);
    else if(!s.slideDir)s.slideDir=world.random()<.5?-1:1;
    const push=-into*Math.min(1,strength);
    acc.x+=ux*push+tx*s.slideDir*push*.9;
    acc.y+=uy*push+ty*s.slideDir*push*.9;
  }
}

// A sheep may never overlap a dog. If it is pinned between a dog and a wall it squeezes round the dog's side.
function keepOffDogs(world,s,dt){
  const reach=bodyRadius(s)+DOG_RADIUS;
  for(const dog of world.threats){
    const ex=s.x-dog.x,ey=s.y-dog.y,dist=Math.hypot(ex,ey);
    if(dist>=reach)continue;
    const ux=dist>1e-3?ex/dist:Math.cos(s.heading),uy=dist>1e-3?ey/dist:Math.sin(s.heading);
    s.x=dog.x+ux*reach;s.y=dog.y+uy*reach;
    const vn=s.vx*ux+s.vy*uy;
    if(vn<0){s.vx-=vn*ux;s.vy-=vn*uy;}
    collide(world,s);
    if(Math.hypot(s.x-dog.x,s.y-dog.y)<reach-.5){ // pinned: slip sideways, toward open field
      let tx=-uy,ty=ux;
      if(tx*(world.W/2-s.x)+ty*(world.H/2-s.y)<0){tx=-tx;ty=-ty;}
      s.x+=tx*140*dt;s.y+=ty*140*dt;s.vx=tx*110;s.vy=ty*110;s.fear=1;
      collide(world,s);
    }
  }
}

// A sheep inside a pen that takes its kind is penned and counted. One inside the other kind's pen
// is not counted and stays free, to wander out or be driven out.
function checkPens(world,s){
  const P=world.pens.find(P=>insidePen(P,s,fitsPen(P,s)?9:0)); // the wrong kind counts as inside even against the wall
  if(P&&fitsPen(P,s)){
    s.penned=P;s.wrongPen=null;s.fear=0;world.penned++;
    world.events.push({type:'pen',x:s.x,y:s.y,sheep:s});
    return;
  }
  if(P&&P!==s.wrongPen)world.events.push({type:'wrong',x:s.x,y:s.y,sheep:s});
  s.wrongPen=P||null;
}

// distance from point p to the segment [x1,y1,x2,y2]
function segmentDistance(p,[x1,y1,x2,y2]){
  const ex=x2-x1,ey=y2-y1,u=clamp(((p.x-x1)*ex+(p.y-y1)*ey)/(ex*ex+ey*ey),0,1);
  return Math.hypot(p.x-x1-ex*u,p.y-y1-ey*u);
}
// A gate shuts once every sheep its pen takes is penned, no sheep of the other kind stands inside,
// and nobody is in the gateway (a gate shutting on a sheep would push it into the wrong pen for good).
function shutGates(world){
  for(const P of world.pens){
    if(P.shut)continue;
    const gate=gateOpening(P);
    if(world.sheep.some(s=>!s.penned&&(fitsPen(P,s)||s.wrongPen===P||segmentDistance(s,gate)<30)))continue;
    P.shut=true;world.walls.push(gateOpening(P));
    world.events.push({type:'shut',pen:P});
  }
}

function moveSheep(world,s,dt){
  const free=!s.penned,isLamb=s.kind===LAMB,boost=isLamb?LAMB_BOOST:1,hidden=inBush(world,s);
  const acc={x:0,y:0};
  s.huddleTime=Math.max(0,s.huddleTime-dt);
  s.hideTime=Math.max(0,s.hideTime-dt);

  // what is going on around it
  const dogs=free?senseDogs(world,s,acc):{fleeX:0,fleeY:0,awayX:0,awayY:0,fear:0,panic:0};
  s.panic+=(dogs.panic-s.panic)*Math.min(1,dt*(dogs.panic>s.panic?4:1.5));
  const flock=senseFlock(world,s,acc);
  const calmDown=dt*(isLamb?.9:.6)*(hidden?3:1),wasFear=s.fear;
  s.fear=Math.max(dogs.fear,flock.maxFear*(isLamb?.45:.7)*(1-.4*s.panic),s.fear-calmDown);
  if(free&&s.fear>.55&&wasFear<=.55)world.events.push({type:'bleat',kind:s.kind,sheep:s});

  // desired velocity, in priority order
  let wantX=dogs.fleeX+dogs.awayX*3,wantY=dogs.fleeY+dogs.awayY*3; // 1 flee, 3 slow drift away
  if(free){
    const [px,py]=dropBackward(...centrePull(world,s),dogs.awayX,dogs.awayY);
    wantX+=px;wantY+=py;
  }
  if(flock.count&&free){const [fx,fy]=flockVelocity(s,flock,dogs);wantX+=fx;wantY+=fy;} // 2
  else if(free&&world.open){const [rx,ry]=rejoinVelocity(world,s,dogs);wantX+=rx;wantY+=ry;}      // 2, alone: back to the flock
  const spot=s.hideTime&&free?hideSpot(world,s):null;
  if(spot){ // a bark overrides everything: trot to the hiding spot behind the ewes
    const gx=spot[0]-s.x,gy=spot[1]-s.y,gap=Math.hypot(gx,gy)||1,speed=Math.min(HIDE_SPEED*boost,gap*4);
    wantX=gx/gap*speed;wantY=gy/gap*speed;
  }else s.hideTime=0;
  if(free){ // calm sheep ease into a new velocity, scared ones react at once
    const fleeSpeed=Math.hypot(dogs.fleeX,dogs.fleeY);
    const k=s.huddleTime?7:s.hideTime?9:2+6*Math.min(1,fleeSpeed/100);
    acc.x+=(wantX-s.vx)*k;acc.y+=(wantY-s.vy)*k;
  }

  // direct pushes
  if(free&&!hidden&&s.fear>.3)for(const [bx,by,br] of world.bushes){ // scared sheep dive into bushes
    const dx=bx-s.x,dy=by-s.y,dist=Math.hypot(dx,dy)||1;
    if(dist<br+60){acc.x+=dx/dist*140*s.fear;acc.y+=dy/dist*140*s.fear;}
  }
  if(free)for(const P of world.pens){ // drawn in through the gate of a pen that takes it
    if(P.shut||P.locked||!fitsPen(P,s))continue;
    const ahead=(s.x-P.gateX)*P.outX+(s.y-P.gateY)*P.outY; // how far out in front of the gate line
    if(ahead<-4&&!insidePen(P,s,0))continue; // beside or behind the pen: not pulled against its walls
    const dx=P.insideX-s.x,dy=P.insideY-s.y,dist=Math.hypot(dx,dy)||1;
    if(dist<140){const k=1-dist/140;acc.x+=dx/dist*160*k;acc.y+=dy/dist*160*k;}
  }
  s.wanderAngle+=(world.random()-.5)*dt*(isLamb?11:6); // grazing amble when calm
  if(s.fear<(isLamb?.25:.1)){const f=isLamb?32:14;acc.x+=Math.cos(s.wanderAngle)*f;acc.y+=Math.sin(s.wanderAngle)*f;}
  s.hopTime=Math.max(0,s.hopTime-dt);
  if(isLamb&&free&&s.fear<.2&&s.hopTime===0&&world.random()<dt*.3){ // a little skip
    s.hopTime=.4;s.vx+=Math.cos(s.wanderAngle)*75;s.vy+=Math.sin(s.wanderAngle)*75;
  }
  if(free)steerOffWalls(world,s,acc);
  else{ // penned: amble to the back of the pen, leaving the gateway to the ones still coming in
    const dx=s.penned.backX-s.x,dy=s.penned.backY-s.y,dist=Math.hypot(dx,dy)||1;
    if(dist>20){acc.x+=dx/dist*20;acc.y+=dy/dist*20;}
  }

  // move
  s.vx+=acc.x*dt;s.vy+=acc.y*dt;
  if(s.penned){const damp=Math.exp(-2.2*dt);s.vx*=damp;s.vy*=damp;}
  const terrain=inRect(world.mud,s)?.45:hidden?.6:1;
  const maxSpeed=(s.penned?14:230*boost)*terrain,speed=Math.hypot(s.vx,s.vy);
  if(speed>maxSpeed){s.vx*=maxSpeed/speed;s.vy*=maxSpeed/speed;}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(speed>4){ // turn the body toward where it is going
    let turn=Math.atan2(s.vy,s.vx)-s.heading;
    turn=Math.atan2(Math.sin(turn),Math.cos(turn));
    s.heading+=turn*Math.min(1,dt*6);
  }
  collide(world,s);
  if(!s.penned){keepOffDogs(world,s,dt);checkPens(world,s);}
  if(s.penned){const P=s.penned;s.x=clamp(s.x,P.x+10,P.x+P.w-10);s.y=clamp(s.y,P.y+10,P.y+P.h-10);}
}

// Storm levels: every 18-32 s a clap of thunder frightens every free sheep at once.
function thunder(world){
  if(world.level.weather!=='storm')return;
  world.nextThunder??=12;
  if(world.t<world.nextThunder)return;
  world.nextThunder+=18+world.random()*14;
  for(const s of world.sheep)if(!s.penned){s.fear=Math.max(s.fear,.7);s.panic=Math.max(s.panic,.6);}
  world.events.push({type:'thunder'});
}

// Wolf levels: level.wolf = {den:[x,y] on the field edge, at: first visit (s), every: s between visits}.
// The wolf slinks toward the nearest sheep and scatters the flock (sheep fear it like a sprinting dog, from
// further off); a dog coming within WOLF_SHY, or a bark in range, sends it bolting back to its den.
const WOLF_RANGE=190,WOLF_SHY=140,WOLF_HUNT=105,WOLF_FLEE=210;
function moveWolf(world,dt){
  const plan=world.level.wolf;
  if(!plan)return;
  const w=world.wolf??={x:plan.den[0],y:plan.den[1],vx:0,vy:0,heading:0,range:WOLF_RANGE,sprint:1,state:'away',back:plan.at};
  if(w.state==='away'){
    if(world.t<w.back)return;
    Object.assign(w,{state:'hunt',x:plan.den[0],y:plan.den[1],vx:0,vy:0});
    world.events.push({type:'howl'});
  }
  let nearDog=Infinity,dog=null;
  for(const d of world.dogs){const dist=Math.hypot(d.x-w.x,d.y-w.y);if(dist<nearDog){nearDog=dist;dog=d;}}
  if(w.state==='hunt'&&nearDog<WOLF_SHY)scareWolf(world);
  let tx,ty,speed;
  if(w.state==='hunt'){
    let prey=null,best=Infinity;
    for(const s of world.sheep)if(!s.penned){const d=Math.hypot(s.x-w.x,s.y-w.y);if(d<best){best=d;prey=s;}}
    if(!prey)return scareWolf(world);
    [tx,ty,speed]=[prey.x,prey.y,WOLF_HUNT];
  }else{ // bolting home, veering away from the dog that chased it
    const hx=plan.den[0]-w.x,hy=plan.den[1]-w.y,home=Math.hypot(hx,hy)||1;
    if(home<20){w.state='away';w.back=world.t+plan.every*(.8+.4*world.random());return;}
    const ax=dog?(w.x-dog.x)/(nearDog||1):0,ay=dog?(w.y-dog.y)/(nearDog||1):0,away=nearDog<WOLF_SHY*1.5?.8:0;
    [tx,ty,speed]=[w.x+hx/home*100+ax*100*away,w.y+hy/home*100+ay*100*away,WOLF_FLEE];
  }
  const dx=tx-w.x,dy=ty-w.y,dist=Math.hypot(dx,dy)||1,k=Math.min(1,dt*4);
  w.vx+=(dx/dist*speed-w.vx)*k;w.vy+=(dy/dist*speed-w.vy)*k;
  w.x+=w.vx*dt;w.y+=w.vy*dt;
  if(Math.hypot(w.vx,w.vy)>5)w.heading=Math.atan2(w.vy,w.vx);
  collide(world,w,4);
}
function scareWolf(world){
  const w=world.wolf;
  if(!w||w.state!=='hunt')return;
  w.state='flee';world.events.push({type:'wolfFlee'});
}

function step(world,dt){
  world.t+=dt;
  thunder(world);
  moveWolf(world,dt);
  world.threats=world.wolf&&world.wolf.state!=='away'?[...world.dogs,world.wolf]:world.dogs;
  buildGrid(world);
  for(const dog of world.dogs)moveDog(world,dog,dt);
  for(const s of world.sheep)moveSheep(world,s,dt);
  checkCourse(world);
  shutGates(world);
}
if(typeof module!=='undefined')module.exports={LEVELS,FARMS,ORDER,makeWorld,step,bark,scareWolf,gateOpening,DT,LIMIT,cluster,rng,RMIN,DOG_WALK,DOG_MAX,EWE,LAMB};
</script>

<script>
/* ---------- game UI ---------- */
const DOG_COLOURS=['#efbd4c','#71bdf0','#f0806f'];

const camRange=(size,view)=>size+2*MARGIN>view?[-MARGIN,size+MARGIN-view]:[(size-view)/2,(size-view)/2];

let stars={};

function saveStars(){try{localStorage.setItem(STARS_KEY,JSON.stringify(stars));}catch(e){}}

/* ---------- sound: recorded bark and bleats (two voices per kind, loudness-matched), the rest synthesised ---------- */
const SOUND_KEY='need-for-sheep-sound';
let soundOn=true;
try{soundOn=localStorage.getItem(SOUND_KEY)!=='off';}catch(e){}
// <audio> elements rather than Web Audio buffers, because a page opened from file:// may not fetch its own files
const clips={};
for(const name of ['waf','ewe-1','ewe-2','lamb-1','lamb-2'])clips[name]=Array.from({length:4},()=>{
  const a=new Audio(`audio/${name}.mp3`);a.preload='auto';a.preservesPitch=false;return a;
});
let clipTurn=0;
function playClip(name,volume=1,rate=1){
  if(!soundOn)return;
  const pool=clips[name],a=pool[clipTurn++%pool.length];
  a.volume=clamp(volume,0,1);a.playbackRate=rate;a.currentTime=0;a.play().catch(()=>{});
}
let audio=null;
function audioCtx(){ // created on the first key or tap, as browsers require
  const first=!audio;
  try{audio??=new AudioContext();if(audio.state==='suspended')audio.resume();}catch(e){}
  if(first&&audio)setRain();

}
// one plucked note, optionally gliding to endFreq
function tone(freq,{delay=0,length=.2,volume=.15,type='triangle',endFreq}={}){
  if(!soundOn||!audio)return;
  const t=audio.currentTime+delay,osc=audio.createOscillator(),gain=audio.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t);
  if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,t+length);
  gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.008);
  gain.gain.exponentialRampToValueAtTime(.001,t+length);
  osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+length+.02);
}
const PEN_NOTES=[523,587,659,784,880,1047,1175,1319,1568];
let penStreak=0,lastPen=-9;
function penChime(t){ // each sheep penned soon after the last one sounds a step higher
  penStreak=t-lastPen<1.6?Math.min(penStreak+1,PEN_NOTES.length-1):0;lastPen=t;
  const f=PEN_NOTES[penStreak];
  tone(f,{length:.25});tone(f*2,{length:.1,volume:.05,type:'sine'});
}
const wrongBuzz=()=>{tone(233,{length:.12,volume:.07,type:'square',endFreq:200});tone(196,{delay:.09,length:.18,volume:.07,type:'square',endFreq:160});};
const gateThud=delay=>{tone(150,{delay,length:.2,volume:.4,type:'sine',endFreq:55});tone(440,{delay,length:.05,volume:.1,endFreq:220});};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,{delay:i*.1,length:i<3?.25:.6,volume:.14}));
const tinkle=speed=>{ // the bellwether's bell, louder the faster she goes
  const v=Math.min(.05,.012+speed/5000),f=1960+Math.random()*80;
  tone(f,{length:.35,volume:v,type:'sine'});tone(f*2.76,{length:.12,volume:v*.4,type:'sine'});
};
let lastCaw=0;
function caw(){ // a crow startled into the air: two rough, falling squawks, now and then
  const t=nowS();
  if(t-lastCaw<1.2)return;
  lastCaw=t;
  for(const delay of [0,.17]){tone(780,{delay,length:.12,volume:.035,type:'sawtooth',endFreq:420});tone(1170,{delay,length:.08,volume:.02,type:'square',endFreq:700});}
}
const fanfareShort=()=>[659,880].forEach((f,i)=>tone(f,{delay:i*.09,length:.22,volume:.12}));
const timeUp=()=>[392,330,262].forEach((f,i)=>tone(f,{delay:i*.16,length:.3,volume:.12}));
let lastBleat=0,nextIdleBleat=3,lastVoice=[1,1];
function bleat(kind,volume){
  const t=nowS();
  if(t-lastBleat<.28)return; // a scared flock bleats a few times, not once per sheep
  lastBleat=t;
  const voice=Math.random()<.7?3-lastVoice[kind]:lastVoice[kind]; // mostly alternate the two voices
  lastVoice[kind]=voice;
  playClip(`${kind===LAMB?'lamb':'ewe'}-${voice}`,volume,.94+Math.random()*.14);
}
function idleBleat(t){ // now and then a calm sheep bleats on its own
  if(t<nextIdleBleat)return;
  nextIdleBleat=t+3+Math.random()*5;
  const calm=world.sheep.filter(s=>s.fear<.2);
  if(calm.length)bleat(calm[Math.random()*calm.length|0].kind,.3);
}
function toggleSound(){
  soundOn=!soundOn;
  try{localStorage.setItem(SOUND_KEY,soundOn?'on':'off');}catch(e){}
  showSound();setRain();
}

// Ambience: birds by day, crickets at night, a hiss of rain on wet levels.
let nextAmbient=2,rainNode=null;
function ambience(t){
  if(!soundOn||!audio||t<nextAmbient||mode==='paused')return;
  if(level.weather==='night'){ // a cricket's trill
    nextAmbient=t+.8+Math.random()*2.2;
    const f=4100+Math.random()*500;
    for(let i=0;i<5+Math.random()*4;i++)tone(f,{delay:i*.045,length:.025,volume:.012,type:'sine'});
  }else if(level.weather!=='storm'&&level.weather!=='fog'){ // a bird somewhere
    nextAmbient=t+4+Math.random()*7;
    const base=2600+Math.random()*1600,notes=2+Math.random()*4|0;
    for(let i=0;i<notes;i++)tone(base*(1+(i%2)*.18),{delay:i*.11,length:.08,volume:.016,type:'sine',endFreq:base*(1.25+(i%2)*.1)});
  }else nextAmbient=t+5;
}
function setRain(){ // a loop of filtered noise while it rains (Wet ground and storms)
  const wet=level&&(level.weather==='storm'||farmOf(levelIndex)==='Wet ground');
  if(rainNode){rainNode.stop();rainNode=null;}
  if(!wet||!soundOn||!audio)return;
  const len=audio.sampleRate*2,buf=audio.createBuffer(1,len,audio.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();
  src.buffer=buf;src.loop=true;filter.type='lowpass';filter.frequency.value=level.weather==='storm'?1400:2200;

}
const showSound=()=>{$('#bSound').textContent=soundOn?'🔊':'🔇';};

/* ---------- ghosts: a run's dog paths, raced on later attempts ---------- */
const GHOST_HZ=10;                     // path samples per second

try{myGhosts=JSON.parse(localStorage.getItem(GHOSTS_KEY)||'{}')||{};}catch(e){myGhosts={};}
function recordRun(){
  while(world.t>=run[0].length/2/GHOST_HZ)
    world.dogs.forEach((dog,i)=>run[i].push(Math.round(dog.x),Math.round(dog.y)));
}
// leaderboard ghosts come from strangers: check the shape before drawing anything from them
const validGhost=dogs=>Array.isArray(dogs)&&dogs.length===level.dogs.length
  &&dogs.every(d=>Array.isArray(d)&&d.length>=2&&d.length%2===0&&d.every(Number.isFinite));

}

/* ---------- level and dog pickers, results ---------- */
// One farm at a time: arrows step through the farms, its levels sit beside it.
let shownFarm=0;

  const farm=FARMS[shownFarm],first=FARMS.slice(0,shownFarm).reduce((n,f)=>n+f.levels.length,0);

    b.disabled=!FARMS[shownFarm+step];b.onclick=()=>{shownFarm+=step;buildLevels();};return b;};
  const name=document.createElement('div');name.className='farmname';
  name.innerHTML=`<span>Farm ${shownFarm+1} of ${FARMS.length}</span><b></b><small>★ ${earned}/${farm.levels.length*3}</small>`;
  name.querySelector('b').textContent=farm.name;
  nav.append(arrow('◀',-1,'Previous farm'),name,arrow('▶',1,'Next farm'));
  const row=document.createElement('div');row.className='farmlevels';
  farm.levels.forEach((i,k)=>{
    const b=document.createElement('button'),got=stars[i]||0;
    b.className='lv'+(i==levelIndex?' cur':'');
    b.innerHTML=`<b>${first+k+1}</b><small>${'★'.repeat(got)}${'·'.repeat(3-got)}</small>`;

function buildDogs(){

function load(i){

// A line of nonsense for the results card, made from what happened in this run.

  const metres=runStats.run/10,bits=[`Your dog ran ${metres<1000?Math.round(metres)+' m':(metres/1000).toFixed(1)+' km'}`];
  if(runStats.barks)bits.push(`barked ${runStats.barks===1?'once':runStats.barks+' times'}`);
  if(runStats.faints)bits.push(`made ${runStats.faints===1?'a sheep':runStats.faints+' sheep'} faint`);
  let line=bits.length>1?bits.slice(0,-1).join(', ')+' and '+bits.at(-1):bits[0];

}

/* ---------- online leaderboard: a Supabase table (see leaderboard.sql), best time per name per level ---------- */
const BOARD={url:'',key:''}; // Supabase project URL and anon public key; empty = no leaderboard button
const NAME_KEY='need-for-sheep-name';
const BOARD_SIZE=5;
let sent=false; // this run's time is already on the board
function boardFetch(path,options={}){
  return fetch(`${BOARD.url}/rest/v1/${path}`,{...options,headers:{apikey:BOARD.key,Authorization:`Bearer ${BOARD.key}`,'Content-Type':'application/json',...options.headers}})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r;});
}
function openBoard(){

async function showBoard(me){

    if(level!==levelIndex)return;
    const row=(rank,r)=>{
      const li=document.createElement('li');li.className=r.name===me?'me':'';
      li.title='Race this ghost';li.onclick=()=>raceGhost(r.name,r.time);
      for(const text of [rank,r.name,r.time.toFixed(1)+' s']){const span=document.createElement('span');span.textContent=text;li.appendChild(span);}
      return li;
    };
    list.replaceChildren(...rows.map((r,i)=>row(i+1,r)));
    note.textContent=rows.length?'':'No times yet. Be the first!';
    if(me&&!rows.some(r=>r.name===me)){ // below the top five: count the names ahead of you
      const mine=await (await boardFetch(`best?level=eq.${level}&name=eq.${encodeURIComponent(me)}`)).json();
      if(!mine.length)return;
      const ahead=await boardFetch(`best?level=eq.${level}&time=lt.${mine[0].time}&select=name`,{method:'HEAD',headers:{Prefer:'count=exact'}});
      list.appendChild(row(+ahead.headers.get('content-range').split('/')[1]+1,mine[0]));
    }
  }catch(e){note.textContent='Leaderboard offline. Try again later.';}
}
async function sendScore(e){
  e.preventDefault();
  const name=$('#boardName').value.trim().slice(0,16);
  if(!name||sent)return;

    sent=true;
  }catch(err){$('#boardSend').disabled=false;$('#boardNote').textContent='Could not send. Try again.';return;}
  showBoard(name);
}
async function raceGhost(name,time){
  try{
    const [row]=await (await boardFetch(`best?level=eq.${levelIndex}&name=eq.${encodeURIComponent(name)}&select=ghost`)).json();
    if(!validGhost(row?.ghost)){$('#boardNote').textContent='No ghost saved for that time.';return;}

/* ---------- controls: hold and drag to run the selected dog, tap a dog to switch ---------- */
const toScreen=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width*FIELD_W,(e.clientY-r.top)/r.height*FIELD_H];};
const toField=([sx,sy])=>[clamp(cam.x+sx/zoom,DOG_EDGE,world.W-DOG_EDGE),clamp(cam.y+sy/zoom,DOG_EDGE,world.H-DOG_EDGE)];
// Centre the view on the selected dog, easing after it (snap: jump there), never past the field edge.
function followCamera(dt,snap){
  const dog=world.dogs[selected],k=snap?1:1-Math.exp(-5*dt);
  const tx=clamp(dog.x-FIELD_W/zoom/2,...camRange(world.W,FIELD_W/zoom)),ty=clamp(dog.y-FIELD_H/zoom/2,...camRange(world.H,FIELD_H/zoom));
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}
const playing=()=>mode==='ready'||mode==='play';
const nextDog=()=>pickDog((selected+1)%level.dogs.length);
canvas.addEventListener('pointerdown',e=>{
  audioCtx();
  if(mode==='paused'&&e.button!==2){pause(false);return;}
  if(e.button===2||!playing())return; // right button: next dog, see contextmenu
  const screen=toScreen(e),sent=minimapPoint(screen);
  if(sent){world.dogs[selected].send=sent;start();return;} // a tap on the map sends the dog there on its own
  const p=toField(screen);
  let hit=-1,best=30;
  world.dogs.forEach((d,i)=>{const dist=Math.hypot(d.x-p[0],d.y-p[1]);if(dist<best){best=dist;hit=i;}});
  if(hit>=0)pickDog(hit);
  pointerHeld=true;pointerScreen=screen;pointer=p;start();
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(pointerHeld)pointerScreen=toScreen(e);});
const release=()=>{pointerHeld=false;};
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

// The shepherd's whistles: hold Q (come bye) or E (away to me) and the dog runs round the flock,
// clockwise or anticlockwise, at the distance it is now (never closer than FLANK_MIN).
const WHISTLES={q:1,e:-1},FLANK_MIN=110;
let whistleHeld=0; // a whistle held on the on-screen buttons: 1 come bye, -1 away
function whistleTone(dir){ // a rising (come bye) or falling (away) two-note whistle
  const [a,b]=dir>0?[1800,2600]:[2600,1800];
  tone(a,{length:.16,volume:.05,type:'sine',endFreq:b});tone(b,{delay:.18,length:.14,volume:.04,type:'sine',endFreq:a});
}
// the bunch of free sheep nearest the dog: everything within 250 px of the nearest free sheep, in a growing chain
function nearestBunch(dog){
  const free=world.sheep.filter(s=>!s.penned);
  if(!free.length)return null;
  let first=free[0],best=Infinity;
  for(const s of free){const d=Math.hypot(s.x-dog.x,s.y-dog.y);if(d<best){best=d;first=s;}}
  const bunch=[first],seen=new Set(bunch);
  for(let k=0;k<bunch.length;k++)for(const s of free)if(!seen.has(s)&&Math.hypot(s.x-bunch[k].x,s.y-bunch[k].y)<60){seen.add(s);bunch.push(s);}
  return {x:bunch.reduce((a,s)=>a+s.x,0)/bunch.length,y:bunch.reduce((a,s)=>a+s.y,0)/bunch.length,size:bunch.length};
}
function flankTarget(dog,dir){
  const c=nearestBunch(dog);
  if(!c)return null;
  const r=Math.max(FLANK_MIN+Math.sqrt(c.size)*6,Math.hypot(dog.x-c.x,dog.y-c.y)),a=Math.atan2(dog.y-c.y,dog.x-c.x)+dir*Math.min(.6,90/r);
  return [clamp(c.x+Math.cos(a)*r,DOG_EDGE,world.W-DOG_EDGE),clamp(c.y+Math.sin(a)*r,DOG_EDGE,world.H-DOG_EDGE)];
}

// A dog sent across the field runs an outrun: if the flock is in its way it swings wide round it, on the side
// it is already on, instead of scattering the sheep by charging through them.
function outrun(dog,goal){
  const c=nearestBunch(dog);
  if(!c)return goal;
  const R=150+Math.sqrt(c.size)*8,[gx,gy]=goal,dx=gx-dog.x,dy=gy-dog.y,len=Math.hypot(dx,dy)||1;
  if(Math.hypot(gx-c.x,gy-c.y)<R||Math.hypot(dog.x-c.x,dog.y-c.y)<R*.8)return goal; // going to the flock, or already at it
  const u=clamp(((c.x-dog.x)*dx+(c.y-dog.y)*dy)/(len*len),0,1),px=dog.x+dx*u,py=dog.y+dy*u;
  if(Math.hypot(c.x-px,c.y-py)>=R)return goal; // the way is clear
  const nx=-dy/len,ny=dx/len,side=(c.x-dog.x)*nx+(c.y-dog.y)*ny>0?-1:1; // pass on the far side from the flock
  return [clamp(c.x+nx*side*R*1.15,DOG_EDGE,world.W-DOG_EDGE),clamp(c.y+ny*side*R*1.15,DOG_EDGE,world.H-DOG_EDGE)];
}

const MOVE_KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
const keyName=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('contextmenu',e=>{if(e.target.tagName==='INPUT')return;e.preventDefault();nextDog();});
function doBark(){
  if(!playing())return;
  start();
  const dog=world.dogs[selected];
  if(!bark(world,selected))return;
  const t=nowS();
  barkRings.push({x:dog.x,y:dog.y,t0:t});
  playClip('waf',1,.95+Math.random()*.12);
  runStats.barks++;
  // now and then a ewe right next to the barking dog faints clean away (for show: it is only huddling)
  const close=world.sheep.find(s=>!s.penned&&s.kind===EWE&&Math.hypot(s.x-dog.x,s.y-dog.y)<70);
  if(close&&!reducedMotion&&Math.random()<.25){anim(close).faintUntil=t+1.6;bubbles=bubbles.filter(b=>b.who!==close);sayIf(close,['x_x','*thud*','I’m out'],1,t);runStats.faints++;}
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return; // typing a leaderboard name
  shift=e.shiftKey;audioCtx();
  const k=keyName(e);
  if(k===' '){e.preventDefault();if(!e.repeat)doBark();return;}
  if(k==='p'||k==='Escape'){pause(mode==='play');return;}
  if(k==='Enter'&&mode==='done'&&e.target.tagName!=='BUTTON'){($('#ovNext').hidden?$('#ovRetry'):$('#ovNext')).click();return;}
  if(mode==='paused'&&MOVE_KEYS[k])pause(false);
  if(WHISTLES[k]&&!e.repeat&&playing()){keys.add(k);start();whistleTone(WHISTLES[k]);return;}
  if(MOVE_KEYS[k]){e.preventDefault();if(playing()){keys.add(k);start();}}
  else if(k>='1'&&k<='3')pickDog(+k-1);
  else if(k==='Tab'){e.preventDefault();nextDog();}
  else if(k==='r')reset();
  else if(k==='m')toggleSound();
  else if(k==='g'&&ghost)toggleGhost();
});
addEventListener('keyup',e=>{shift=e.shiftKey;keys.delete(keyName(e));});
addEventListener('blur',()=>{keys.clear();whistleHeld=0;pointerHeld=false;pause(true);});

$('#bBark').onclick=doBark;
for(const [id,dir] of [['#bComeBye',1],['#bAway',-1]]){ // hold to whistle
  const b=$(id),stop=()=>{if(whistleHeld===dir)whistleHeld=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',e=>{audioCtx();if(!playing())return;start();whistleHeld=dir;b.classList.add('on');whistleTone(dir);b.setPointerCapture(e.pointerId);});
  b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);
}
